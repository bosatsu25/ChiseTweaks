name: Official Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: SemVer increment represented by gradle.properties
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      confirm_release:
        description: Confirm that manual Prism gameplay smoke testing has passed for this exact main-branch commit
        required: true
        type: boolean
        default: false
      cleanup_legacy_verified_tags:
        description: Remove obsolete CI-generated verified-v* tags/releases after the new official release succeeds
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: chisetweaks-official-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish one runtime JAR
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Require main branch and manual runtime confirmation
        env:
          CONFIRMED: ${{ inputs.confirm_release }}
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Releases may only be started from the main branch.' >&2
            exit 1
          fi
          if [[ "$CONFIRMED" != 'true' ]]; then
            echo 'Release blocked: confirm the manual Prism gameplay smoke test first.' >&2
            exit 1
          fi

      - name: Checkout exact main commit with tags
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python 3.13
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate version syntax and repository inputs
        run: |
          python scripts/version_policy.py
          python scripts/repository_audit.py
          python scripts/source_usage_audit.py

      - name: Run full release quality gate
        run: ./gradlew --no-daemon --stacktrace clean ciGate

      - name: Generate and audit release candidate
        id: artifact-audit
        run: |
          python scripts/quality_summary.py
          python scripts/artifact_audit.py
          python scripts/visual_asset_audit.py
          python scripts/release_residue_audit.py

      - name: Validate requested SemVer increment
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          CURRENT_VERSION: ${{ steps.artifact-audit.outputs.version }}
        run: |
          previous_version=''
          previous_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ -n "$previous_tag" ]]; then
            previous_version="${previous_tag#v}"
          else
            legacy_tag="$(git tag --list 'verified-v*' --sort=-creatordate | head -n 1)"
            if [[ -n "$legacy_tag" ]]; then
              previous_version="${legacy_tag#verified-v}"
              previous_version="${previous_version%-java25-*}"
            fi
          fi

          if [[ -n "$previous_version" ]]; then
            python scripts/version_policy.py \
              --previous "$previous_version" \
              --release-type "$RELEASE_TYPE"
          else
            echo 'No previous Chise release tag found; syntax validation is the initial release gate.'
          fi

          tag="v${CURRENT_VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Release tag '${tag}' already exists. Increment mod_version before releasing." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous_version=$previous_version" >> "$GITHUB_OUTPUT"

      - name: Verify runtime metadata
        id: metadata
        env:
          VERSION: ${{ steps.artifact-audit.outputs.version }}
          RUNTIME_JAR: ${{ steps.artifact-audit.outputs.runtime_jar }}
          RUNTIME_SHA256: ${{ steps.artifact-audit.outputs.runtime_sha256 }}
        run: |
          runtime="build/libs/$RUNTIME_JAR"
          if [[ ! -f "$runtime" ]]; then
            echo "Runtime JAR is missing: $runtime" >&2
            exit 1
          fi

          actual_sha256="$(sha256sum "$runtime" | cut -d' ' -f1)"
          if [[ "$actual_sha256" != "$RUNTIME_SHA256" ]]; then
            echo 'Runtime JAR SHA-256 does not match the artifact audit.' >&2
            exit 1
          fi

          fabric_metadata="$(unzip -p "$runtime" fabric.mod.json)"
          fabric_version="$(jq -r '.version // empty' <<<"$fabric_metadata")"
          mc_version="$(jq -r '.depends.minecraft // empty' <<<"$fabric_metadata")"
          loader_constraint="$(jq -r '.depends.fabricloader // empty' <<<"$fabric_metadata")"
          fabric_api_constraint="$(jq -r '.depends["fabric-api"] // empty' <<<"$fabric_metadata")"
          java_constraint="$(jq -r '.depends.java // empty' <<<"$fabric_metadata")"
          environment="$(jq -r '.environment // empty' <<<"$fabric_metadata")"
          server_required="$(jq -r 'if (.custom.chisetweaks | has("serverInstallationRequired")) then .custom.chisetweaks.serverInstallationRequired else empty end' <<<"$fabric_metadata")"

          if [[ "$fabric_version" != "$VERSION" ]]; then
            echo "fabric.mod.json version '$fabric_version' does not match '$VERSION'." >&2
            exit 1
          fi
          if [[ "$environment" != 'client' || "$server_required" != 'false' ]]; then
            echo 'Runtime no longer satisfies the client-only release contract.' >&2
            exit 1
          fi

          display_version="${VERSION%%+mc*}"
          echo "minecraft_version=$mc_version" >> "$GITHUB_OUTPUT"
          echo "loader_constraint=$loader_constraint" >> "$GITHUB_OUTPUT"
          echo "fabric_api_constraint=$fabric_api_constraint" >> "$GITHUB_OUTPUT"
          echo "java_constraint=$java_constraint" >> "$GITHUB_OUTPUT"
          echo "display_version=$display_version" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.artifact-audit.outputs.version }}
          DISPLAY_VERSION: ${{ steps.metadata.outputs.display_version }}
          MC_VERSION: ${{ steps.metadata.outputs.minecraft_version }}
          LOADER_CONSTRAINT: ${{ steps.metadata.outputs.loader_constraint }}
          FABRIC_API_CONSTRAINT: ${{ steps.metadata.outputs.fabric_api_constraint }}
          JAVA_CONSTRAINT: ${{ steps.metadata.outputs.java_constraint }}
          RUNTIME_JAR: ${{ steps.artifact-audit.outputs.runtime_jar }}
          RUNTIME_SHA256: ${{ steps.artifact-audit.outputs.runtime_sha256 }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          cat > release-notes.md <<EOF
          ## 📦 Install this file / 導入するファイル

          **Prism Launcher の Mods には次の1ファイルだけを追加してください。**

          **\`${RUNTIME_JAR}\`**

          ## ChiseTweaks ${DISPLAY_VERSION}

          - Release type: \`${RELEASE_TYPE}\`
          - Full version: \`${VERSION}\`
          - Minecraft: \`${MC_VERSION}\`
          - Fabric Loader: \`${LOADER_CONSTRAINT}\`
          - Fabric API: \`${FABRIC_API_CONSTRAINT}\`
          - Java: \`${JAVA_CONSTRAINT}\`
          - SHA-256: \`${RUNTIME_SHA256}\`
          - Server installation required: \`false\`
          - Uploaded mod assets: \`1 runtime JAR\`

          CI does not publish builds. This Release was produced only after the full release quality gate and manual Prism smoke-test confirmation.
          EOF

      - name: Create version tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          DISPLAY_VERSION: ${{ steps.metadata.outputs.display_version }}
          MC_VERSION: ${{ steps.metadata.outputs.minecraft_version }}
          RUNTIME_JAR: ${{ steps.artifact-audit.outputs.runtime_jar }}
          RUNTIME_SHA256: ${{ steps.artifact-audit.outputs.runtime_sha256 }}
        run: |
          gh release create "$TAG" \
            "build/libs/$RUNTIME_JAR" \
            --target "$GITHUB_SHA" \
            --title "ChiseTweaks ${DISPLAY_VERSION} — Minecraft ${MC_VERSION}" \
            --notes-file release-notes.md

          gh api "repos/${GH_REPO}/releases/tags/${TAG}" > /tmp/official-release.json
          asset_count="$(jq '[.assets[]?] | length' /tmp/official-release.json)"
          if [[ "$asset_count" != '1' ]]; then
            echo "Official release must expose exactly one uploaded mod asset, found ${asset_count}." >&2
            exit 1
          fi
          if ! jq -e --arg name "$RUNTIME_JAR" '.assets[]? | select(.name == $name)' /tmp/official-release.json >/dev/null; then
            echo "Official release is missing runtime JAR '$RUNTIME_JAR'." >&2
            exit 1
          fi
          remote_runtime_digest="$(jq -r --arg name "$RUNTIME_JAR" '.assets[]? | select(.name == $name) | .digest // empty' /tmp/official-release.json)"
          if [[ "$remote_runtime_digest" != "sha256:${RUNTIME_SHA256}" ]]; then
            echo "Published runtime JAR digest mismatch: '$remote_runtime_digest'." >&2
            exit 1
          fi

          printf '\n### Official Release\n- Tag: `%s`\n- Uploaded mod assets: `1`\n- Install: `%s`\n' \
            "$TAG" "$RUNTIME_JAR" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove legacy CI-generated verified tags after successful release
        if: ${{ inputs.cleanup_legacy_verified_tags }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t legacy_tags < <(git tag --list 'verified-v*')
          for legacy_tag in "${legacy_tags[@]}"; do
            [[ -z "$legacy_tag" ]] && continue
            if gh release view "$legacy_tag" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release delete "$legacy_tag" --repo "$GH_REPO" --yes
            fi
            git push origin ":refs/tags/$legacy_tag"
            git tag -d "$legacy_tag" >/dev/null 2>&1 || true
            echo "Removed legacy CI tag: $legacy_tag"
          done
