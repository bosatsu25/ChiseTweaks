name: Official Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Confirm that manual Prism gameplay smoke testing has passed for this exact main-branch commit
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish verified main artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Require main branch and manual runtime confirmation
        env:
          CONFIRMED: ${{ inputs.confirm_release }}
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Releases may only be started from the main branch.' >&2
            exit 1
          fi
          if [[ "$CONFIRMED" != 'true' ]]; then
            echo 'Release blocked: confirm the manual Prism gameplay smoke test first.' >&2
            exit 1
          fi

      - name: Resolve successful CI for this exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id="$(gh run list \
            --repo "$GH_REPO" \
            --workflow ci.yml \
            --branch main \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -z "$run_id" ]]; then
            echo "Release blocked: no successful CI run exists for exact main SHA $GITHUB_SHA." >&2
            echo 'Run or re-run CI on this exact main commit first.' >&2
            exit 1
          fi

          artifact_name="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}/artifacts" \
            --jq '.artifacts[] | select(.expired == false and (.name | startswith("ChiseTweaks-")) and (.name | endswith("-verified-JAR"))) | .name' \
            | head -n 1)"
          if [[ -z "$artifact_name" ]]; then
            echo "Release blocked: successful CI run $run_id has no unexpired verified JAR artifact." >&2
            echo 'Re-run CI on this exact main commit to regenerate the release candidate.' >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Download exact verified CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.ci.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.ci.outputs.artifact_name }}
        run: |
          mkdir -p release
          gh run download "$RUN_ID" \
            --repo "$GH_REPO" \
            --name "$ARTIFACT_NAME" \
            --dir release

      - name: Verify artifact integrity and metadata
        id: metadata
        env:
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt

          version="$(jq -r '.version // empty' artifact-audit.json)"
          mc_version="$(jq -r '.minecraft_version // empty' artifact-audit.json)"
          runtime_jar="$(jq -r '.runtime_jar // empty' artifact-audit.json)"
          sources_jar="$(jq -r '.sources_jar // empty' artifact-audit.json)"
          runtime_sha256="$(jq -r '.runtime_sha256 // empty' artifact-audit.json)"

          for value in "$version" "$mc_version" "$runtime_jar" "$sources_jar" "$runtime_sha256"; do
            if [[ -z "$value" ]]; then
              echo 'Verified artifact metadata is incomplete.' >&2
              exit 1
            fi
          done
          if [[ ! -f "$runtime_jar" || ! -f "$sources_jar" ]]; then
            echo 'Verified runtime or sources JAR is missing from the downloaded artifact.' >&2
            exit 1
          fi

          actual_runtime_sha256="$(sha256sum "$runtime_jar" | cut -d' ' -f1)"
          if [[ "$actual_runtime_sha256" != "$runtime_sha256" ]]; then
            echo 'artifact-audit.json runtime SHA-256 does not match the downloaded JAR.' >&2
            exit 1
          fi

          expected_suffix="+mc${mc_version}"
          if [[ "$version" != *"$expected_suffix" ]]; then
            echo "Version '$version' must end with '$expected_suffix'." >&2
            exit 1
          fi

          display_version="${version%%+mc*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$mc_version" >> "$GITHUB_OUTPUT"
          echo "runtime_jar=$runtime_jar" >> "$GITHUB_OUTPUT"
          echo "sources_jar=$sources_jar" >> "$GITHUB_OUTPUT"
          echo "runtime_sha256=$runtime_sha256" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "display_version=$display_version" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Refuse duplicate release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release tag '${TAG}' already exists." >&2
            exit 1
          fi

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          MC_VERSION: ${{ steps.metadata.outputs.minecraft_version }}
          RUNTIME_JAR: ${{ steps.metadata.outputs.runtime_jar }}
          RUNTIME_SHA256: ${{ steps.metadata.outputs.runtime_sha256 }}
          CI_RUN_ID: ${{ steps.metadata.outputs.ci_run_id }}
        run: |
          cat > release-notes.md <<EOF
          ## ChiseTweaks ${VERSION}

          Verified release for **Minecraft ${MC_VERSION}**, **Fabric Loader 0.19.3** and **Java 25**.

          This release reuses the exact artifact produced by successful main-branch CI run **${CI_RUN_ID}** for commit \`${GITHUB_SHA}\`.
          CI is not executed a second time during release. A manual Prism gameplay smoke test is required before publishing.

          - Minecraft: \`${MC_VERSION}\`
          - Java: \`25\`
          - Runtime JAR: \`${RUNTIME_JAR}\`
          - SHA-256: \`${RUNTIME_SHA256}\`
          - Server installation required: \`false\`

          The sources JAR, checksums, artifact audit and quality summary are attached.
          EOF

      - name: Create version tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.metadata.outputs.tag }}
          DISPLAY_VERSION: ${{ steps.metadata.outputs.display_version }}
          MC_VERSION: ${{ steps.metadata.outputs.minecraft_version }}
          RUNTIME_JAR: ${{ steps.metadata.outputs.runtime_jar }}
          SOURCES_JAR: ${{ steps.metadata.outputs.sources_jar }}
        run: |
          gh release create "$TAG" \
            "release/$RUNTIME_JAR" \
            "release/$SOURCES_JAR" \
            "release/SHA256SUMS.txt" \
            "release/artifact-audit.json" \
            "release/quality-summary.md" \
            --target "$GITHUB_SHA" \
            --title "ChiseTweaks ${DISPLAY_VERSION} — Minecraft ${MC_VERSION}" \
            --notes-file release-notes.md
