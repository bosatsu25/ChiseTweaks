name: Official Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: chisetweaks-official-release-main
  cancel-in-progress: true

jobs:
  release:
    name: Publish verified runtime JAR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ${{ fromJSON(vars.CHISE_CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5

    steps:
      - name: Reject stale CI results
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest_main_sha="$(gh api "repos/${GH_REPO}/commits/main" --jq '.sha')"
          if [[ "$latest_main_sha" != "$TARGET_SHA" ]]; then
            echo "Skipping stale CI result '$TARGET_SHA'; current main is '$latest_main_sha'."
            echo 'should_release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          artifacts="$(gh api "repos/${GH_REPO}/actions/runs/${{ github.event.workflow_run.id }}/artifacts?per_page=100")"
          runtime_count="$(jq '[.artifacts[] | select(.expired == false and (.name | test("^chise-tweaks-.*\\.jar$")))] | length' <<<"$artifacts")"
          if [[ "$runtime_count" == '0' ]]; then
            echo 'No runtime artifact was produced by this successful main CI run; release is not applicable.'
            echo 'should_release=false' >> "$GITHUB_OUTPUT"
            echo 'skip_reason=no-runtime-artifact' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$runtime_count" != '1' ]]; then
            echo "Expected exactly one runtime artifact, found ${runtime_count}." >&2
            exit 1
          fi

          echo 'should_release=true' >> "$GITHUB_OUTPUT"
          echo 'skip_reason=' >> "$GITHUB_OUTPUT"
          echo "Promoting CI artifact from verified commit: $TARGET_SHA"

      - name: Download exact CI artifact
        if: ${{ steps.target.outputs.should_release == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: chise-tweaks-*.jar
          path: release
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate promoted runtime JAR
        if: ${{ steps.target.outputs.should_release == 'true' }}
        id: artifact
        run: |
          mapfile -t candidates < <(find release -maxdepth 1 -type f -name 'chise-tweaks-*.jar' -print)
          if [[ "${#candidates[@]}" -ne 1 ]]; then
            echo "Expected exactly one verified runtime JAR, found ${#candidates[@]}." >&2
            exit 1
          fi

          runtime="${candidates[0]}"
          runtime_jar="$(basename "$runtime")"
          runtime_sha256="$(sha256sum "$runtime" | cut -d' ' -f1)"
          fabric_metadata="$(unzip -p "$runtime" fabric.mod.json)"

          version="$(jq -r '.version // empty' <<<"$fabric_metadata")"
          minecraft_version="$(jq -r '.depends.minecraft // empty' <<<"$fabric_metadata")"
          loader_constraint="$(jq -r '.depends.fabricloader // empty' <<<"$fabric_metadata")"
          fabric_api_constraint="$(jq -r '.depends["fabric-api"] // empty' <<<"$fabric_metadata")"
          java_constraint="$(jq -r '.depends.java // empty' <<<"$fabric_metadata")"
          environment="$(jq -r '.environment // empty' <<<"$fabric_metadata")"
          server_required="$(jq -r 'if (.custom.chisetweaks | has("serverInstallationRequired")) then .custom.chisetweaks.serverInstallationRequired else empty end' <<<"$fabric_metadata")"

          if [[ -z "$version" || -z "$minecraft_version" || -z "$loader_constraint" || -z "$fabric_api_constraint" || -z "$java_constraint" ]]; then
            echo 'Runtime JAR is missing required release metadata.' >&2
            exit 1
          fi
          if [[ "$environment" != 'client' || "$server_required" != 'false' ]]; then
            echo 'Runtime JAR no longer satisfies the client-only release contract.' >&2
            exit 1
          fi
          if [[ "$runtime_jar" != "chise-tweaks-${version}.jar" ]]; then
            echo "Runtime filename '$runtime_jar' does not match embedded version '$version'." >&2
            exit 1
          fi

          {
            echo "runtime_jar=$runtime_jar"
            echo "runtime_path=$runtime"
            echo "runtime_sha256=$runtime_sha256"
            echo "version=$version"
            echo "tag=v${version}"
            echo "minecraft_version=$minecraft_version"
            echo "loader_constraint=$loader_constraint"
            echo "fabric_api_constraint=$fabric_api_constraint"
            echo "java_constraint=$java_constraint"
          } >> "$GITHUB_OUTPUT"

      - name: Prevent duplicate or dangling releases
        if: ${{ steps.target.outputs.should_release == 'true' }}
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.artifact.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists; nothing new will be published."
            echo 'should_publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag '$TAG' exists without a matching GitHub Release; refusing to reuse it." >&2
            exit 1
          fi

          echo 'should_publish=true' >> "$GITHUB_OUTPUT"

      - name: Enforce one-step SemVer increment
        if: ${{ steps.target.outputs.should_release == 'true' && steps.publish.outputs.should_publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.artifact.outputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)\+mc.+$ ]]; then
            echo "Release version '$VERSION' does not match MAJOR.MINOR.PATCH+mc<version>." >&2
            exit 1
          fi
          current_major="${BASH_REMATCH[1]}"
          current_minor="${BASH_REMATCH[2]}"
          current_patch="${BASH_REMATCH[3]}"

          previous_tag="$(gh release list --repo "$GH_REPO" --limit 100 --json tagName,isDraft,isPrerelease,publishedAt \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | test("^v[0-9]+\\.")))] | sort_by(.publishedAt) | last | .tagName // ""')"

          if [[ -z "$previous_tag" ]]; then
            echo "No previous official SemVer release exists; accepting initial release '$VERSION'."
            exit 0
          fi

          previous_version="${previous_tag#v}"
          if [[ ! "$previous_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)\+mc.+$ ]]; then
            echo "Previous official release '$previous_tag' does not match the versioning contract." >&2
            exit 1
          fi
          previous_major="${BASH_REMATCH[1]}"
          previous_minor="${BASH_REMATCH[2]}"
          previous_patch="${BASH_REMATCH[3]}"

          release_type=''
          if (( current_major == previous_major && current_minor == previous_minor && current_patch == previous_patch + 1 )); then
            release_type='patch'
          elif (( current_major == previous_major && current_minor == previous_minor + 1 && current_patch == 0 )); then
            release_type='minor'
          elif (( current_major == previous_major + 1 && current_minor == 0 && current_patch == 0 )); then
            release_type='major'
          else
            echo "Version '$VERSION' is not an exact patch/minor/major increment from '$previous_version'." >&2
            exit 1
          fi

          echo "SemVer release increment: ${previous_version} -> ${VERSION} (${release_type})"

      - name: Prepare concise release notes
        if: ${{ steps.target.outputs.should_release == 'true' && steps.publish.outputs.should_publish == 'true' }}
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
          MC_VERSION: ${{ steps.artifact.outputs.minecraft_version }}
          LOADER_CONSTRAINT: ${{ steps.artifact.outputs.loader_constraint }}
          FABRIC_API_CONSTRAINT: ${{ steps.artifact.outputs.fabric_api_constraint }}
          JAVA_CONSTRAINT: ${{ steps.artifact.outputs.java_constraint }}
          RUNTIME_JAR: ${{ steps.artifact.outputs.runtime_jar }}
          RUNTIME_SHA256: ${{ steps.artifact.outputs.runtime_sha256 }}
        run: |
          cat > release-notes.md <<EOF
          ## Install / 導入

          Prism Launcher の Mods には **\`${RUNTIME_JAR}\`** だけを追加してください。

          - Version: \`${VERSION}\`
          - Minecraft: \`${MC_VERSION}\`
          - Fabric Loader: \`${LOADER_CONSTRAINT}\`
          - Fabric API: \`${FABRIC_API_CONSTRAINT}\`
          - Java: \`${JAVA_CONSTRAINT}\`
          - SHA-256: \`${RUNTIME_SHA256}\`
          EOF

      - name: Create GitHub Release
        if: ${{ steps.target.outputs.should_release == 'true' && steps.publish.outputs.should_publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.artifact.outputs.tag }}
          VERSION: ${{ steps.artifact.outputs.version }}
          RUNTIME_PATH: ${{ steps.artifact.outputs.runtime_path }}
        run: |
          gh release create "$TAG" \
            "$RUNTIME_PATH" \
            --repo "$GH_REPO" \
            --target "$TARGET_SHA" \
            --title "ChiseTweaks ${VERSION}" \
            --notes-file release-notes.md

      - name: Verify published Release metadata
        if: ${{ steps.target.outputs.should_release == 'true' && steps.publish.outputs.should_publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.artifact.outputs.tag }}
          RUNTIME_JAR: ${{ steps.artifact.outputs.runtime_jar }}
          RUNTIME_SHA256: ${{ steps.artifact.outputs.runtime_sha256 }}
        run: |
          gh api "repos/${GH_REPO}/releases/tags/${TAG}" > /tmp/official-release.json

          asset_count="$(jq '[.assets[]?] | length' /tmp/official-release.json)"
          if [[ "$asset_count" != '1' ]]; then
            echo "Official Release must expose exactly one uploaded mod asset, found ${asset_count}." >&2
            exit 1
          fi

          remote_digest="$(jq -r --arg name "$RUNTIME_JAR" '.assets[]? | select(.name == $name) | .digest // empty' /tmp/official-release.json)"
          if [[ "$remote_digest" != "sha256:${RUNTIME_SHA256}" ]]; then
            echo "Published runtime JAR digest mismatch: '$remote_digest'." >&2
            exit 1
          fi

          published_tag_sha="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')"
          if [[ "$published_tag_sha" != "$TARGET_SHA" ]]; then
            echo "Release tag points to '$published_tag_sha' instead of CI-verified '$TARGET_SHA'." >&2
            exit 1
          fi

          printf '### Official Release\n- Tag: `%s`\n- Commit: `%s`\n- Runtime JAR: `%s`\n- SHA-256: `%s`\n- Exact CI artifact promoted: `PASS`\n' \
            "$TAG" "$TARGET_SHA" "$RUNTIME_JAR" "$RUNTIME_SHA256" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize skipped release
        if: ${{ steps.target.outputs.should_release == 'false' }}
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          SKIP_REASON: ${{ steps.target.outputs.skip_reason }}
        run: |
          reason="$SKIP_REASON"
          if [[ -z "$reason" ]]; then
            reason='stale-main'
          fi
          printf '### Official Release\n- Skipped commit: `%s`\n- Reason: `%s`\n' "$TARGET_SHA" "$reason" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize existing release
        if: ${{ steps.target.outputs.should_release == 'true' && steps.publish.outputs.should_publish == 'false' }}
        env:
          TAG: ${{ steps.artifact.outputs.tag }}
        run: |
          printf '### Official Release\n- `%s` already exists. No duplicate Release was created.\n' "$TAG" >> "$GITHUB_STEP_SUMMARY"
