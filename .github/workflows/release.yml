name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  provenance-gate:
    name: Require resolved provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Require resolved provenance status
        run: |
          grep -Fxq 'provenance_status=resolved' gradle.properties || {
            echo 'Public release is blocked until provenance_status=resolved.' >&2
            exit 1
          }

  verify:
    needs: provenance-gate
    uses: ./.github/workflows/verify-build.yml

  validate-tag:
    name: Validate release tag
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Require exact version tag
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          expected="v${VERSION}"
          if [[ "$TAG" != "$expected" ]]; then
            echo "Release tag '$TAG' must exactly match '$expected'." >&2
            exit 1
          fi

  release:
    name: Publish verified JAR
    needs:
      - verify
      - validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: release

      - name: Verify downloaded checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      - name: Prepare release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          RUNTIME_JAR: ${{ needs.verify.outputs.runtime_jar }}
          RUNTIME_SHA256: ${{ needs.verify.outputs.runtime_sha256 }}
        run: |
          cat > release-notes.md <<EOF
          ## ChiseTweaks ${VERSION}

          This release publishes the exact runtime JAR that passed the Java 25
          quality gate, artifact audit, JaCoCo gate and PIT mutation gate.

          - Runtime JAR: \`${RUNTIME_JAR}\`
          - SHA-256: \`${RUNTIME_SHA256}\`

          Full checksums are attached as \`SHA256SUMS.txt\`.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RUNTIME_JAR: ${{ needs.verify.outputs.runtime_jar }}
          SOURCES_JAR: ${{ needs.verify.outputs.sources_jar }}
        run: |
          gh release create "$TAG" \
            "release/$RUNTIME_JAR" \
            "release/$SOURCES_JAR" \
            "release/SHA256SUMS.txt" \
            "release/artifact-audit.json" \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md
