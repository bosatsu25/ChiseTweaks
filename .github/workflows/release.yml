name: Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Confirm that manual Prism gameplay smoke testing has passed for this exact main-branch commit
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-gate:
    name: Require main branch and manual runtime confirmation
    runs-on: ubuntu-24.04
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Releases may only be started from the main branch.' >&2
          exit 1

      - name: Require Prism runtime confirmation
        if: ${{ !inputs.confirm_release }}
        run: |
          echo 'Release blocked: confirm the manual Prism gameplay smoke test first.' >&2
          exit 1

  verify:
    needs: release-gate
    uses: ./.github/workflows/verify-build.yml

  release:
    name: Tag and publish verified JAR
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: release

      - name: Verify downloaded checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      - name: Prepare release metadata
        id: metadata
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          MC_VERSION: ${{ needs.verify.outputs.minecraft_version }}
        run: |
          expected_suffix="+mc${MC_VERSION}"
          if [[ "$VERSION" != *"$expected_suffix" ]]; then
            echo "Version '$VERSION' must end with '$expected_suffix'." >&2
            exit 1
          fi
          display_version="${VERSION%%+mc*}"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "display_version=${display_version}" >> "$GITHUB_OUTPUT"

      - name: Refuse duplicate release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release tag '${TAG}' already exists." >&2
            exit 1
          fi

      - name: Prepare release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          MC_VERSION: ${{ needs.verify.outputs.minecraft_version }}
          RUNTIME_JAR: ${{ needs.verify.outputs.runtime_jar }}
          RUNTIME_SHA256: ${{ needs.verify.outputs.runtime_sha256 }}
        run: |
          cat > release-notes.md <<EOF
          ## ChiseTweaks ${VERSION}

          Verified release for **Minecraft ${MC_VERSION}**, **Fabric Loader 0.19.3** and **Java 25**.

          This publishes the exact client-only runtime JAR that passed the rebuilt retained-scope gate:
          JUnit contracts, JaCoCo line coverage, PIT mutation testing, repository scope audit and artifact audit.
          A manual Prism gameplay smoke test is also required before this workflow can publish.

          - Minecraft: \`${MC_VERSION}\`
          - Java: \`25\`
          - Runtime JAR: \`${RUNTIME_JAR}\`
          - SHA-256: \`${RUNTIME_SHA256}\`
          - Server installation required: \`false\`

          The sources JAR, checksums, artifact audit and quality summary are attached.
          EOF

      - name: Create version tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.metadata.outputs.tag }}
          DISPLAY_VERSION: ${{ steps.metadata.outputs.display_version }}
          MC_VERSION: ${{ needs.verify.outputs.minecraft_version }}
          RUNTIME_JAR: ${{ needs.verify.outputs.runtime_jar }}
          SOURCES_JAR: ${{ needs.verify.outputs.sources_jar }}
        run: |
          gh release create "$TAG" \
            "release/$RUNTIME_JAR" \
            "release/$SOURCES_JAR" \
            "release/SHA256SUMS.txt" \
            "release/artifact-audit.json" \
            "release/quality-summary.md" \
            --target "$GITHUB_SHA" \
            --title "ChiseTweaks ${DISPLAY_VERSION} — Minecraft ${MC_VERSION}" \
            --notes-file release-notes.md
