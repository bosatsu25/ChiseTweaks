name: Refactor size pass

on:
  push:
    branches:
      - refactor/size-runtime-consolidation

permissions:
  contents: read

concurrency:
  group: chisetweaks-refactor-size-pass
  cancel-in-progress: true

jobs:
  measure:
    name: Java 25 build and JAR size map
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build baseline
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace clean test assemble

      - name: Resolve runtime JAR
        id: runtime
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'chise-tweaks-*.jar' ! -name '*-sources.jar' -print)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "Expected one runtime JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          jar="${jars[0]}"
          echo "jar=${jar}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${jar}")" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c%s "${jar}")" >> "$GITHUB_OUTPUT"

      - name: Build size maps
        run: |
          mkdir -p build/size-pass
          python scripts/runtime_jar_size_map.py "${{ steps.runtime.outputs.jar }}" --top 50 --format markdown > build/size-pass/runtime-size-map.md
          python scripts/runtime_jar_size_map.py "${{ steps.runtime.outputs.jar }}" --top 200 --format json > build/size-pass/runtime-size-map.json
          printf 'runtime_jar=%s\nruntime_bytes=%s\n' "${{ steps.runtime.outputs.name }}" "${{ steps.runtime.outputs.bytes }}" > build/size-pass/runtime-size.txt
          cat build/size-pass/runtime-size.txt
          cat build/size-pass/runtime-size-map.md

      - name: Upload runtime and maps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refactor-size-pass
          path: |
            ${{ steps.runtime.outputs.jar }}
            build/size-pass/runtime-size.txt
            build/size-pass/runtime-size-map.md
            build/size-pass/runtime-size-map.json
          if-no-files-found: error
          retention-days: 3
