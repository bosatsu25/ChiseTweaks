name: Verify Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    # Keep this composed status context aligned with branch protection:
    # "verify / Java 25 quality gate".
    name: Java 25 quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python 3.13
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate version policy
        id: version
        continue-on-error: true
        run: python scripts/version_policy.py

      - name: Audit repository inputs and production source usage
        id: repository
        continue-on-error: true
        run: |
          python scripts/repository_audit.py
          python scripts/source_usage_audit.py

      - name: Compile production artifacts and test classes
        id: compile
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace clean assemble testClasses

      - name: Run JUnit contracts
        id: junit
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace test

      - name: Run JaCoCo report and coverage gate
        id: jacoco
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace jacocoTestReport jacocoTestCoverageVerification

      - name: Run PIT mutation and test-strength gates
        id: pit
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace pitest

      - name: Audit final artifacts
        id: artifacts
        continue-on-error: true
        run: |
          python scripts/artifact_audit.py
          python scripts/visual_asset_audit.py
          python scripts/release_residue_audit.py

      - name: Generate diagnostic quality report
        id: summary
        if: ${{ always() }}
        continue-on-error: true
        run: python scripts/quality_summary.py --allow-partial

      - name: Append verification summary
        if: ${{ always() }}
        run: |
          if [[ -f build/ci/quality-summary.md ]]; then
            cat build/ci/quality-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## ChiseTweaks retained-scope quality summary\n\n- Quality summary was not generated.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f build/ci/artifact-summary.md ]]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat build/ci/artifact-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

          printf '\n## Gate outcomes\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Version policy: `%s`\n' "${{ steps.version.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Repository/source audit: `%s`\n' "${{ steps.repository.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Compile/artifacts: `%s`\n' "${{ steps.compile.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- JUnit: `%s`\n' "${{ steps.junit.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- JaCoCo: `%s`\n' "${{ steps.jacoco.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- PIT: `%s`\n' "${{ steps.pit.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Artifact audits: `%s`\n' "${{ steps.artifacts.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Diagnostic summary: `%s`\n' "${{ steps.summary.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf '\n- Distribution policy: CI verifies only. It creates no tag, no GitHub Release, and uploads no ZIP artifact.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce aggregate quality gate
        if: ${{ always() }}
        env:
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          REPOSITORY_OUTCOME: ${{ steps.repository.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          JUNIT_OUTCOME: ${{ steps.junit.outcome }}
          JACOCO_OUTCOME: ${{ steps.jacoco.outcome }}
          PIT_OUTCOME: ${{ steps.pit.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifacts.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: |
          failed=0
          for gate in \
            "version:$VERSION_OUTCOME" \
            "repository:$REPOSITORY_OUTCOME" \
            "compile:$COMPILE_OUTCOME" \
            "junit:$JUNIT_OUTCOME" \
            "jacoco:$JACOCO_OUTCOME" \
            "pit:$PIT_OUTCOME" \
            "artifacts:$ARTIFACT_OUTCOME" \
            "summary:$SUMMARY_OUTCOME"; do
            name="${gate%%:*}"
            outcome="${gate#*:}"
            if [[ "$outcome" != 'success' ]]; then
              echo "Required CI gate '$name' finished with '$outcome'." >&2
              failed=1
            fi
          done
          exit "$failed"
