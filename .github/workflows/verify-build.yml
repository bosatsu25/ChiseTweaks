name: Verify Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    # Keep this composed status context aligned with branch protection:
    # "verify / Java 25 quality gate".
    name: Java 25 quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python 3.13
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate version policy
        run: python scripts/version_policy.py

      - name: Audit repository inputs and production source usage
        run: |
          python scripts/repository_audit.py
          python scripts/source_usage_audit.py

      - name: Build and run the single Gradle CI gate
        run: ./gradlew --no-daemon --stacktrace clean ciGate

      - name: Generate quality report
        run: python scripts/quality_summary.py

      - name: Audit final artifacts
        id: artifact-audit
        run: |
          python scripts/artifact_audit.py
          python scripts/visual_asset_audit.py
          python scripts/release_residue_audit.py

      - name: Append verification summary
        run: |
          cat build/ci/quality-summary.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat build/ci/artifact-summary.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n- Visual asset audit: `PASS`\n' >> "$GITHUB_STEP_SUMMARY"
          printf '\n- Verified runtime: `%s`\n' "${{ steps.artifact-audit.outputs.runtime_jar }}" >> "$GITHUB_STEP_SUMMARY"
          printf '\n- Distribution policy: CI verifies only. It creates no tag, no GitHub Release, and uploads no ZIP artifact.\n' >> "$GITHUB_STEP_SUMMARY"
