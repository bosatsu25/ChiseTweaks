name: Verify Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    # Keep this composed status context aligned with branch protection:
    # "verify / Java 25 quality gate".
    name: Java 25 quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python 3.13
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Audit repository inputs and production source usage
        run: |
          python scripts/repository_audit.py
          python scripts/source_usage_audit.py

      - name: Build and run the single Gradle CI gate
        run: ./gradlew --no-daemon --stacktrace clean ciGate

      - name: Generate quality report
        run: python scripts/quality_summary.py

      - name: Audit final artifacts
        id: artifact-audit
        run: |
          python scripts/artifact_audit.py
          python scripts/visual_asset_audit.py
          python scripts/release_residue_audit.py

      - name: Append verification summary
        run: |
          cat build/ci/quality-summary.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat build/ci/artifact-summary.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n- Visual asset audit: `PASS`\n' >> "$GITHUB_STEP_SUMMARY"
          printf '\n- Verified runtime: `%s`\n' "${{ steps.artifact-audit.outputs.runtime_jar }}" >> "$GITHUB_STEP_SUMMARY"
          printf '\n- Distribution policy: GitHub Releases expose only the runtime JAR; QA evidence remains in this Actions artifact.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Stage verification evidence
        run: |
          mkdir -p build/verified
          cp "build/libs/${{ steps.artifact-audit.outputs.runtime_jar }}" build/verified/
          cp "build/libs/${{ steps.artifact-audit.outputs.sources_jar }}" build/verified/
          cp build/ci/SHA256SUMS.txt build/verified/
          cp build/ci/artifact-audit.json build/verified/
          cp build/ci/visual-asset-audit.json build/verified/
          cp build/ci/quality-summary.md build/verified/

      - name: Upload verification evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ChiseTweaks-${{ steps.artifact-audit.outputs.version }}-verification-evidence
          path: build/verified/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chisetweaks-ci-failure-${{ github.run_id }}
          path: |
            build/reports/tests/
            build/reports/jacoco/
            build/reports/pitest/
            build/test-results/
            build/ci/
          if-no-files-found: ignore
          retention-days: 7
