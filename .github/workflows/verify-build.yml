name: Verify Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    # branch protectionのrequired contextと一致させる。
    name: Java 25 quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify CI runtime toolchain
        id: environment
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys
          expected = (3, 14)
          actual = sys.version_info[:2]
          if actual != expected:
              raise SystemExit(f"Expected Python {expected[0]}.{expected[1]}, got {actual[0]}.{actual[1]}")
          print(f"Python runtime: {sys.version.split()[0]}")
          PY

          java_feature="$(java -XshowSettings:properties -version 2>&1 \
            | sed -n 's/^[[:space:]]*java.specification.version = //p' \
            | head -n 1)"
          if [[ "$java_feature" != '25' ]]; then
            echo "Expected Java 25, got '$java_feature'." >&2
            exit 1
          fi

          gradle_version="$(./gradlew --version | sed -n 's/^Gradle //p' | head -n 1)"
          if [[ "$gradle_version" != '9.7.1' ]]; then
            echo "Expected Gradle 9.7.1, got '$gradle_version'." >&2
            exit 1
          fi

          echo "Java specification: $java_feature"
          echo "Gradle runtime: $gradle_version"

      - name: Validate version policy
        id: version
        continue-on-error: true
        run: python scripts/version_policy.py

      - name: Audit repository, documentation, compatibility and source usage
        id: repository
        continue-on-error: true
        run: |
          python scripts/repository_audit.py
          python scripts/source_usage_audit.py
          python scripts/documentation_consistency_audit.py
          python scripts/compatibility_contract_audit.py

      - name: Compile production artifacts and test classes
        id: compile
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace clean assemble testClasses

      - name: Run JUnit contracts
        id: junit
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace test

      - name: Run JaCoCo report and coverage gate
        id: jacoco
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace jacocoTestReport jacocoTestCoverageVerification

      - name: Run PIT mutation and test-strength gates
        id: pit
        if: ${{ always() && steps.compile.outcome == 'success' && steps.junit.outcome == 'success' }}
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace pitest

      - name: Audit final artifacts
        id: artifacts
        continue-on-error: true
        run: |
          python scripts/artifact_audit.py
          python scripts/visual_asset_audit.py
          python scripts/release_residue_audit.py

      - name: Generate diagnostic quality report
        id: summary
        if: ${{ always() }}
        continue-on-error: true
        run: python scripts/quality_summary.py --allow-partial

      - name: Append verification summary
        if: ${{ always() }}
        run: |
          if [[ -f build/ci/quality-summary.md ]]; then
            cat build/ci/quality-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## ChiseTweaks retained-scope quality summary\n\n- Quality summary was not generated.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f build/ci/artifact-summary.md ]]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat build/ci/artifact-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

          printf '\n## Gate outcomes\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- CI toolchain: `%s`\n' "${{ steps.environment.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Version policy: `%s`\n' "${{ steps.version.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Repository/docs/compat/source audit: `%s`\n' "${{ steps.repository.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Compile/artifacts: `%s`\n' "${{ steps.compile.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- JUnit: `%s`\n' "${{ steps.junit.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- JaCoCo: `%s`\n' "${{ steps.jacoco.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- PIT: `%s`\n' "${{ steps.pit.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Artifact audits: `%s`\n' "${{ steps.artifacts.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Diagnostic summary: `%s`\n' "${{ steps.summary.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          printf '\n- Distribution policy: CI verifies and retains only the verified runtime JAR temporarily. It creates no tag, no GitHub Release, and no ZIP bundle.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce aggregate quality gate
        if: ${{ always() }}
        env:
          ENVIRONMENT_OUTCOME: ${{ steps.environment.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          REPOSITORY_OUTCOME: ${{ steps.repository.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          JUNIT_OUTCOME: ${{ steps.junit.outcome }}
          JACOCO_OUTCOME: ${{ steps.jacoco.outcome }}
          PIT_OUTCOME: ${{ steps.pit.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifacts.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: |
          failed=0
          for gate in \
            "environment:$ENVIRONMENT_OUTCOME" \
            "version:$VERSION_OUTCOME" \
            "repository:$REPOSITORY_OUTCOME" \
            "compile:$COMPILE_OUTCOME" \
            "junit:$JUNIT_OUTCOME" \
            "jacoco:$JACOCO_OUTCOME" \
            "artifacts:$ARTIFACT_OUTCOME" \
            "summary:$SUMMARY_OUTCOME"; do
            name="${gate%%:*}"
            outcome="${gate#*:}"
            if [[ "$outcome" != 'success' ]]; then
              echo "Required CI gate '$name' finished with '$outcome'." >&2
              failed=1
            fi
          done

          if [[ "$COMPILE_OUTCOME" == 'success' && "$JUNIT_OUTCOME" == 'success' ]]; then
            if [[ "$PIT_OUTCOME" != 'success' ]]; then
              echo "Required CI gate 'pit' finished with '$PIT_OUTCOME'." >&2
              failed=1
            fi
          fi
          exit "$failed"

      - name: Upload verified runtime JAR
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: build/libs/${{ steps.artifacts.outputs.runtime_jar }}
          archive: false
          if-no-files-found: error
          retention-days: 14
