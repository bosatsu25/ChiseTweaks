name: Publish Verified Build

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: verified-release-main
  cancel-in-progress: true

jobs:
  publish:
    name: Publish latest verified JAR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      JAVA_VERSION: '25'
      VERIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      VERIFIED_RUN_URL: ${{ github.event.workflow_run.html_url }}

    steps:
      - name: Download verified artifacts from successful CI run
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: chisetweaks-verified-*
          path: release
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate downloaded verified artifact set
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          test -f release/artifact-audit.json
          test -f release/SHA256SUMS.txt
          test -f release/quality-summary.md

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("release")
          audit = json.loads((root / "artifact-audit.json").read_text(encoding="utf-8"))

          required = ("version", "runtime_jar", "runtime_sha256", "sources_jar")
          missing = [key for key in required if not audit.get(key)]
          if missing:
              raise SystemExit(f"artifact-audit.json is missing required fields: {missing}")

          mod_version = audit["version"]
          if "+mc" not in mod_version:
              raise SystemExit(f"verified version does not contain Minecraft suffix: {mod_version}")

          release_version, minecraft_version = mod_version.split("+mc", 1)
          java_version = os.environ["JAVA_VERSION"]

          if not release_version or not minecraft_version:
              raise SystemExit(f"invalid verified version: {mod_version}")

          runtime = root / audit["runtime_jar"]
          sources = root / audit["sources_jar"]
          if not runtime.is_file():
              raise SystemExit(f"verified runtime JAR is missing: {runtime}")
          if not sources.is_file():
              raise SystemExit(f"verified sources JAR is missing: {sources}")

          release_tag = f"verified-v{release_version}+mc{minecraft_version}-java{java_version}"

          outputs = {
              "mod_version": mod_version,
              "release_version": release_version,
              "minecraft_version": minecraft_version,
              "java_version": java_version,
              "release_tag": release_tag,
              "runtime_jar": runtime.name,
              "runtime_sha256": audit["runtime_sha256"],
              "sources_jar": sources.name,
          }

          metadata = {
              "channel": "verified",
              "release_tag": release_tag,
              "release_version": release_version,
              "mod_version": mod_version,
              "minecraft_version": minecraft_version,
              "java_version": java_version,
              "commit": os.environ["VERIFIED_SHA"],
              "ci_run_id": os.environ["VERIFIED_RUN_ID"],
              "ci_run_url": os.environ["VERIFIED_RUN_URL"],
              "runtime_jar": runtime.name,
              "runtime_sha256": audit["runtime_sha256"],
              "sources_jar": sources.name,
          }
          (root / "BUILD_METADATA.json").write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Verify downloaded checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      - name: Prepare verified release notes
        env:
          MOD_VERSION: ${{ steps.metadata.outputs.mod_version }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
          MC_VERSION: ${{ steps.metadata.outputs.minecraft_version }}
          JAVA_VERSION: ${{ steps.metadata.outputs.java_version }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          RUNTIME_JAR: ${{ steps.metadata.outputs.runtime_jar }}
          RUNTIME_SHA256: ${{ steps.metadata.outputs.runtime_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${VERIFIED_SHA:0:7}"

          cat > verified-release-notes.md <<EOF
          ## Verified ChiseTweaks build

          This pre-release was created automatically from a successful
          **CI** run on the \`main\` branch.

          ### Version tags

          - Release: \`v${RELEASE_VERSION}\`
          - Minecraft: \`${MC_VERSION}\`
          - Java: \`${JAVA_VERSION}\`
          - Git tag: \`${RELEASE_TAG}\`

          ### Verified artifact

          - Mod version: \`${MOD_VERSION}\`
          - Commit: \`${short_sha}\`
          - Runtime JAR: \`${RUNTIME_JAR}\`
          - Runtime SHA-256: \`${RUNTIME_SHA256}\`
          - Verified CI run: ${VERIFIED_RUN_URL}

          The attached runtime JAR is the exact artifact that passed the Java
          quality gate, including JUnit, repository contracts, JaCoCo coverage,
          PIT mutation testing, build verification, and the artifact audit.

          \`BUILD_METADATA.json\` contains the same release, Minecraft, Java,
          commit, artifact, and CI metadata in machine-readable form.
          EOF

      - name: Replace verified release for this version tuple
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
          MC_VERSION: ${{ steps.metadata.outputs.minecraft_version }}
          JAVA_VERSION: ${{ steps.metadata.outputs.java_version }}
          RUNTIME_JAR: ${{ steps.metadata.outputs.runtime_jar }}
          SOURCES_JAR: ${{ steps.metadata.outputs.sources_jar }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          fi

          gh release create "$RELEASE_TAG" \
            "release/$RUNTIME_JAR" \
            "release/$SOURCES_JAR" \
            "release/SHA256SUMS.txt" \
            "release/artifact-audit.json" \
            "release/quality-summary.md" \
            "release/BUILD_METADATA.json" \
            --target "$VERIFIED_SHA" \
            --title "Verified ChiseTweaks v${RELEASE_VERSION} — Minecraft ${MC_VERSION} — Java ${JAVA_VERSION}" \
            --notes-file verified-release-notes.md \
            --prerelease \
            --latest=false
