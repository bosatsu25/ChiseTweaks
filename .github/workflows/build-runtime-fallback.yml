name: Build runtime JAR fallback

on:
  push:
    branches:
      - build/runtime-jar-fallback

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Build current runtime JAR
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace clean test assemble
          ls -lh build/libs
      - name: Upload runtime JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chisetweaks-runtime-jar
          path: |
            build/libs/chise-tweaks-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 1
