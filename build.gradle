plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

def chiseSodiumRuntime = providers.gradleProperty('chiseSodiumRuntime')
        .map { value -> value.toBoolean() }.orElse(true).get()

repositories {
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional integration only. Mod Menu is not packaged or required at runtime.
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Development/runtime compatibility target only. Production code has no Sodium API dependency.
    if (chiseSodiumRuntime) runtimeOnly "maven.modrinth:sodium:${project.sodium_version}"
}

loom {
    runs {
        client {
            name = 'Chise visual client'
            runDir = 'run/visual-client'
            vmArg '--enable-native-access=ALL-UNNAMED'
        }
    }
}

def fabricMetadata = [
        version              : version.toString(),
        minecraft_version    : project.minecraft_version,
        loader_version       : project.loader_version,
        fabric_api_version   : project.fabric_api_version,
        sodium_compat_version: project.sodium_compat_version
]

processResources {
    inputs.properties fabricMetadata
    filesMatching('fabric.mod.json') { expand(fabricMetadata) }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('sourcesJar') {
    from('LICENSE') { rename { "${it}_${archives_base_name}" } }
    from('LICENSE_MIT') { rename { "${it}_${archives_base_name}" } }
    from('LICENSE_APACHE-2.0') { rename { "${it}_${archives_base_name}" } }
    from('NOTICE')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar {
    from('LICENSE') { rename { "${it}_${archives_base_name}" } }
    from('LICENSE_MIT') { rename { "${it}_${archives_base_name}" } }
    from('LICENSE_APACHE-2.0') { rename { "${it}_${archives_base_name}" } }
    from('NOTICE')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

publishing {
    publications {
        create('mavenJava', MavenPublication) { from components.java }
    }
}
