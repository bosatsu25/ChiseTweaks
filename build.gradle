plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'info.solidsoft.pitest' version '1.19.0'
    id 'jacoco'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

def chiseSodiumRuntime = providers.gradleProperty('chiseSodiumRuntime')
        .map { value -> value.toBoolean() }.orElse(true).get()

repositories {
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    if (chiseSodiumRuntime) runtimeOnly "maven.modrinth:sodium:${project.sodium_version}"

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    runs {
        client {
            name = 'Chise visual client'
            runDir = 'run/visual-client'
            vmArg '--enable-native-access=ALL-UNNAMED'
        }
    }
}

def fabricMetadata = [
        version              : version.toString(),
        minecraft_version    : project.minecraft_version,
        loader_version       : project.loader_version,
        fabric_api_version   : project.fabric_api_version,
        sodium_compat_version: project.sodium_compat_version
]

def runtimeIconRelativePath = 'assets/chisetweaks/icon.png'
def runtimeIconTargetPixels = Integer.parseInt(project.runtime_icon_target_pixels)

processResources {
    inputs.properties fabricMetadata
    inputs.property('runtimeIconTargetPixels', runtimeIconTargetPixels)
    filesMatching('fabric.mod.json') { expand(fabricMetadata) }

    doLast {
        File iconFile = new File(outputs.files.singleFile, runtimeIconRelativePath)
        if (!iconFile.isFile()) {
            throw new GradleException("Runtime icon is missing: ${iconFile}")
        }

        def sourceImage = javax.imageio.ImageIO.read(iconFile)
        if (sourceImage == null) {
            throw new GradleException("Runtime icon is not a readable PNG: ${iconFile}")
        }

        if (sourceImage.width != runtimeIconTargetPixels || sourceImage.height != runtimeIconTargetPixels) {
            def targetImage = new java.awt.image.BufferedImage(
                    runtimeIconTargetPixels,
                    runtimeIconTargetPixels,
                    java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def graphics = targetImage.createGraphics()
            try {
                graphics.setRenderingHint(
                        java.awt.RenderingHints.KEY_INTERPOLATION,
                        java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
                graphics.setRenderingHint(
                        java.awt.RenderingHints.KEY_RENDERING,
                        java.awt.RenderingHints.VALUE_RENDER_QUALITY)
                graphics.drawImage(
                        sourceImage,
                        0,
                        0,
                        runtimeIconTargetPixels,
                        runtimeIconTargetPixels,
                        null)
            } finally {
                graphics.dispose()
            }
            if (!javax.imageio.ImageIO.write(targetImage, 'png', iconFile)) {
                throw new GradleException("Runtime icon PNG writer is unavailable")
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked', '-Werror'])
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxParallelForks = 1
    failFast = false
    systemProperty 'file.encoding', 'UTF-8'
}

tasks.register('comparePerformanceEvidence', JavaExec) {
    group = 'verification'
    description = 'Compares real local Prism captures; optional matching JFR files are analyzed offline.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('dev.chise.chisetweaks.performance.PerformanceEvidenceCli')
    doFirst {
        String baseline = providers.gradleProperty('performanceBaseline').orNull
        String candidate = providers.gradleProperty('performanceCandidate').orNull
        if (!baseline || !candidate) {
            throw new GradleException(
                    'Set -PperformanceBaseline=<baseline.csv> and -PperformanceCandidate=<candidate.csv>.')
        }
        List<String> evidenceArgs = [file(baseline).absolutePath, file(candidate).absolutePath]
        String baselineJfr = providers.gradleProperty('performanceBaselineJfr').orNull
        String candidateJfr = providers.gradleProperty('performanceCandidateJfr').orNull
        if ((baselineJfr == null) != (candidateJfr == null)) {
            throw new GradleException(
                    'Provide both -PperformanceBaselineJfr and -PperformanceCandidateJfr, or neither.')
        }
        if (baselineJfr != null) {
            evidenceArgs.add(file(baselineJfr).absolutePath)
            evidenceArgs.add(file(candidateJfr).absolutePath)
        }
        setArgs(evidenceArgs)
    }
}

jacoco {
    toolVersion = project.jacoco_version
}

// JaCoCoは決定的policy、描画budget、UI geometry/availability、diagnostics、critical runtime dispatchを広く監視する。
def coverageGateClasses = [
        'dev/chise/chisetweaks/core/performance/WorksiteScanThrottlePolicy*.class',
        'dev/chise/chisetweaks/core/performance/WorksiteVisibilityBudgetPolicy*.class',
        'dev/chise/chisetweaks/core/policy/AncientDebrisAnalyzerPolicy*.class',
        'dev/chise/chisetweaks/core/policy/ConfigListPolicy*.class',
        'dev/chise/chisetweaks/core/policy/FeatureAvailabilityPolicy*.class',
        'dev/chise/chisetweaks/core/policy/LavaVisionPalettePolicy*.class',
        'dev/chise/chisetweaks/core/policy/WorksiteHighlightProfilePolicy*.class',
        'dev/chise/chisetweaks/core/vision/FireVisibilityPolicy*.class',
        'dev/chise/chisetweaks/core/vision/GlassHighlightTargetPolicy*.class',
        'dev/chise/chisetweaks/core/vision/OreHighlightRuntimePolicy*.class',
        'dev/chise/chisetweaks/core/vision/VanillaOreVisualCatalog*.class',
        'dev/chise/chisetweaks/core/vision/VisualTargetGroupPolicy*.class',
        'dev/chise/chisetweaks/core/vision/VisualTargetSelectionPolicy*.class',
        'dev/chise/chisetweaks/gui/ChiseTweaksSettingsLayout*.class',
        'dev/chise/chisetweaks/gui/UiAvailabilityPolicy*.class',
        'dev/chise/chisetweaks/runtime/RuntimeDiagnosticDetail*.class',
        'dev/chise/chisetweaks/runtime/RuntimeDiagnosticSnapshot*.class',
        'dev/chise/chisetweaks/runtime/FeatureManager$ComponentSlot*.class'
]

// PITは意味的な分岐・状態遷移を持つpolicyとdiagnostic snapshotへ限定する。
// Geometryの座標算術やFabric依存file I/Oは境界JUnit＋JaCoCoで検証し、等価mutationで全体scoreを希釈しない。
def mutationGateClasses = [
        'dev.chise.chisetweaks.core.performance.WorksiteScanThrottlePolicy',
        'dev.chise.chisetweaks.core.performance.WorksiteVisibilityBudgetPolicy',
        'dev.chise.chisetweaks.core.policy.AncientDebrisAnalyzerPolicy',
        'dev.chise.chisetweaks.core.policy.ConfigListPolicy',
        'dev.chise.chisetweaks.core.policy.FeatureAvailabilityPolicy',
        'dev.chise.chisetweaks.core.policy.LavaVisionPalettePolicy',
        'dev.chise.chisetweaks.core.policy.WorksiteHighlightProfilePolicy',
        'dev.chise.chisetweaks.core.vision.FireVisibilityPolicy',
        'dev.chise.chisetweaks.core.vision.GlassHighlightTargetPolicy',
        'dev.chise.chisetweaks.core.vision.OreHighlightRuntimePolicy',
        'dev.chise.chisetweaks.core.vision.VanillaOreVisualCatalog',
        'dev.chise.chisetweaks.core.vision.VisualTargetGroupPolicy',
        'dev.chise.chisetweaks.core.vision.VisualTargetSelectionPolicy',
        'dev.chise.chisetweaks.gui.UiAvailabilityPolicy',
        'dev.chise.chisetweaks.runtime.RuntimeDiagnosticDetail',
        'dev.chise.chisetweaks.runtime.RuntimeDiagnosticSnapshot',
        'dev.chise.chisetweaks.runtime.FeatureManager$ComponentSlot*'
]

def coverageGateClassDirectories = providers.provider {
    files(sourceSets.main.output.classesDirs.collect { classesDir ->
        fileTree(dir: classesDir, include: coverageGateClasses)
    })
}

jacocoTestReport {
    mustRunAfter tasks.named('test')
    classDirectories.setFrom(coverageGateClassDirectories)
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    dependsOn tasks.named('jacocoTestReport')
    mustRunAfter tasks.named('test')
    classDirectories.setFrom(coverageGateClassDirectories)
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = new BigDecimal(project.quality_line_threshold)
            }
        }
    }
}

pitest {
    targetClasses = mutationGateClasses
    targetTests = [
        'dev.chise.chisetweaks.*Test',
        'dev.chise.chisetweaks.config.*Test',
        'dev.chise.chisetweaks.core.*Test',
        'dev.chise.chisetweaks.core.performance.*Test',
        'dev.chise.chisetweaks.core.policy.*Test',
        'dev.chise.chisetweaks.core.security.*Test',
        'dev.chise.chisetweaks.core.vision.*Test',
        'dev.chise.chisetweaks.gui.*Test',
        'dev.chise.chisetweaks.runtime.*Test'
    ]
    junit5PluginVersion = '1.2.3'
    threads = 2
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    failWhenNoMutations = true
    mutationThreshold = Integer.parseInt(project.quality_mutation_threshold)
    coverageThreshold = Integer.parseInt(project.quality_coverage_threshold)
    testStrengthThreshold = Integer.parseInt(project.quality_test_strength_threshold)
    exportLineCoverage = true
}

tasks.named('pitest') {
    mustRunAfter tasks.named('test')
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('sourcesJar') {
    from('LICENSE') { rename { "${it}_${archives_base_name}" } }
    from('LICENSE_MIT') { rename { "${it}_${archives_base_name}" } }
    from('LICENSE_APACHE-2.0') { rename { "${it}_${archives_base_name}" } }
    from('NOTICE')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar {
    from('LICENSE') { rename { "${it}_${archives_base_name}" } }
    from('LICENSE_MIT') { rename { "${it}_${archives_base_name}" } }
    from('LICENSE_APACHE-2.0') { rename { "${it}_${archives_base_name}" } }
    from('NOTICE')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    exclude '**/*Test.class', '**/test/**'
}

publishing {
    publications {
        create('mavenJava', MavenPublication) { from components.java }
    }
}

tasks.register('qualityGate') {
    group = 'verification'
    description = 'Runs all JUnit contracts once, plus JaCoCo and PIT quality gates.'
    dependsOn tasks.named('test')
    dependsOn tasks.named('jacocoTestReport')
    dependsOn tasks.named('jacocoTestCoverageVerification')
    dependsOn tasks.named('pitest')
}

tasks.register('ciGate') {
    group = 'verification'
    description = 'Single strict CI quality entry point: tests plus reproducible runtime and sources artifacts.'
    dependsOn tasks.named('qualityGate')
    dependsOn tasks.named('build')
}
