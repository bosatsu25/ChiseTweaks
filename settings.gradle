pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = uri('https://maven.fabricmc.net/')
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

gradle.beforeProject { project ->
    if (project.path == ':') {
        project.apply from: new File(settingsDir, 'gradle/chise-visual-assets.gradle')
    }
}

rootProject.name = 'ChiseTweaks'
