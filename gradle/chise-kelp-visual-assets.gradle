import groovy.json.JsonOutput
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

// Kelp Highlight owns a separate clean-room asset generator so Ore Highlights assets remain
// byte-for-byte governed by their existing generator. Both features still use the same Fabric
// baked-model overlay pipeline at runtime.
def generatedKelpVisualAssetsDir = layout.buildDirectory.dir('generated/chiseKelpVisualAssets')

def argb = { a, r, g, b ->
    (((a as int) << 24) | ((r as int) << 16) | ((g as int) << 8) | (b as int)) as int
}
def putPixel = { image, x, y, color ->
    int px = x as int
    int py = y as int
    if (px >= 0 && px < image.width && py >= 0 && py < image.height) image.setRGB(px, py, color as int)
}
def line = { image, x0Raw, y0Raw, x1Raw, y1Raw, colorRaw ->
    int x0 = x0Raw as int
    int y0 = y0Raw as int
    int x1 = x1Raw as int
    int y1 = y1Raw as int
    int color = colorRaw as int
    int dx = Math.abs(x1 - x0)
    int sx = x0 < x1 ? 1 : -1
    int dy = -Math.abs(y1 - y0)
    int sy = y0 < y1 ? 1 : -1
    int error = dx + dy
    while (true) {
        putPixel(image, x0, y0, color)
        if (x0 == x1 && y0 == y1) break
        int twice = 2 * error
        if (twice >= dy) { error += dy; x0 += sx }
        if (twice <= dx) { error += dx; y0 += sy }
    }
}

// Requested party palette. Both colors are present in every frame; only their visual emphasis
// swaps, avoiding a rapid single-color strobe.
def KELP_MAGENTA = [255, 79, 216]
def KELP_ORANGE = [255, 138, 0]
def magenta = argb(255, KELP_MAGENTA[0], KELP_MAGENTA[1], KELP_MAGENTA[2])
def orange = argb(255, KELP_ORANGE[0], KELP_ORANGE[1], KELP_ORANGE[2])
def magentaSoft = argb(210, KELP_MAGENTA[0], KELP_MAGENTA[1], KELP_MAGENTA[2])
def orangeSoft = argb(210, KELP_ORANGE[0], KELP_ORANGE[1], KELP_ORANGE[2])

def drawPartyFrame = { BufferedImage image, int frame, int top ->
    boolean swapped = frame >= 4
    int primary = swapped ? orange : magenta
    int accent = swapped ? magenta : orange
    int primarySoft = swapped ? orangeSoft : magentaSoft
    int accentSoft = swapped ? magentaSoft : orangeSoft

    // Two animated neon ribbons run vertically through the crossed plant planes.
    (0..<16).each { y ->
        int phase = Math.floorMod(y + frame * 2, 10)
        int fold = phase <= 5 ? phase : 10 - phase
        int left = 2 + fold
        int right = 13 - fold
        putPixel(image, left, top + y, primary)
        putPixel(image, Math.min(15, left + 1), top + y, primarySoft)
        putPixel(image, right, top + y, accent)
        putPixel(image, Math.max(0, right - 1), top + y, accentSoft)
    }

    // Constant dual-color side rails keep the plant readable even between moving ribbon pixels.
    line(image, 1, top + 1, 1, top + 14, primarySoft)
    line(image, 14, top + 1, 14, top + 14, accentSoft)

    // Small alternating sparkles create the party effect without replacing the base kelp texture.
    int sparkleY = 2 + Math.floorMod(frame * 3, 11)
    putPixel(image, 4, top + sparkleY, accent)
    putPixel(image, 5, top + sparkleY, accentSoft)
    putPixel(image, 11, top + 15 - sparkleY, primary)
    putPixel(image, 10, top + 15 - sparkleY, primarySoft)
}

def writePartyTexture = { File output ->
    def image = new BufferedImage(16, 128, BufferedImage.TYPE_INT_ARGB)
    (0..<8).each { frame -> drawPartyFrame(image, frame, frame * 16) }
    output.parentFile.mkdirs()
    if (!ImageIO.write(image, 'png', output)) {
        throw new GradleException("No PNG writer is available for ${output}")
    }
}

def writeAnimationMeta = { File output ->
    output.parentFile.mkdirs()
    output.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
            animation: [frametime: 3, interpolate: true]
    ])) + '\n', 'UTF-8')
}

def planeFaces = { texture ->
    [
            north: [texture: texture, uv: [0, 0, 16, 16]],
            south: [texture: texture, uv: [0, 0, 16, 16]]
    ]
}

def partyPlane = { texture, angle ->
    [
            from: [-0.12d, -0.04d, 7.92d],
            to: [16.12d, 16.04d, 8.08d],
            shade: false,
            rotation: [origin: [8, 8, 8], axis: 'y', angle: angle, rescale: false],
            faces: planeFaces(texture)
    ]
}

def partyOverlayModel = { texture ->
    [
            ambientocclusion: false,
            textures: [highlight: texture, particle: texture],
            elements: [partyPlane('#highlight', 45), partyPlane('#highlight', -45)]
    ]
}

def writeModel = { File output, model ->
    output.parentFile.mkdirs()
    output.setText(JsonOutput.prettyPrint(JsonOutput.toJson(model)) + '\n', 'UTF-8')
}

def generateChiseKelpVisualAssets = tasks.register('generateChiseKelpVisualAssets') {
    outputs.dir(generatedKelpVisualAssetsDir)
    doLast {
        File root = generatedKelpVisualAssetsDir.get().asFile
        project.delete(root)
        File textureDir = new File(root, 'assets/chisetweaks/textures/block/visual/kelp')
        File modelDir = new File(root, 'assets/chisetweaks/models/block/visual/overlay')

        File texture = new File(textureDir, 'kelp_party.png')
        writePartyTexture(texture)
        writeAnimationMeta(new File(textureDir, 'kelp_party.png.mcmeta'))
        writeModel(
                new File(modelDir, 'kelp_party.json'),
                partyOverlayModel('chisetweaks:block/visual/kelp/kelp_party'))
    }
}

tasks.matching { it.name == 'processResources' }.configureEach {
    dependsOn(generateChiseKelpVisualAssets)
    from(generatedKelpVisualAssetsDir)
}

tasks.matching { it.name == 'test' }.configureEach {
    dependsOn(generateChiseKelpVisualAssets)
}
