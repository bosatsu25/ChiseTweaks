import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.time.LocalDateTime
import java.util.zip.CRC32
import java.util.zip.Deflater
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

// Runtime JAR size optimization that preserves gameplay semantics and actionable stack traces.
// Keep source/line metadata for diagnostics while dropping local-variable debug tables.
tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.debug = true
    options.debugOptions.debugLevel = 'source,lines'
}

// Keep repository JSON readable, but remove insignificant whitespace from the processed runtime copy.
// This is deliberately syntax-aware: whitespace inside strings and all escape sequences are preserved.
def minifyJsonText = { String source ->
    StringBuilder output = new StringBuilder(source.length())
    boolean inString = false
    boolean escaped = false
    for (int index = 0; index < source.length(); index++) {
        char value = source.charAt(index)
        if (inString) {
            output.append(value)
            if (escaped) {
                escaped = false
            } else if (value == '\\'.charAt(0)) {
                escaped = true
            } else if (value == '"'.charAt(0)) {
                inString = false
            }
        } else if (value == '"'.charAt(0)) {
            inString = true
            output.append(value)
        } else if (!Character.isWhitespace(value)) {
            output.append(value)
        }
    }
    if (inString) {
        throw new GradleException('Unterminated JSON string while compacting runtime resources')
    }
    return output.toString()
}

tasks.named('processResources').configure {
    doLast {
        File resourcesRoot = outputs.files.singleFile
        fileTree(dir: resourcesRoot, include: '**/*.json').files.each { File jsonFile ->
            String source = jsonFile.getText('UTF-8')
            String compact = minifyJsonText(source)
            if (compact.length() < source.length()) {
                jsonFile.setText(compact, 'UTF-8')
            }
        }
    }
}

// ZipOutputStream normally emits a 16-byte data descriptor for DEFLATED entries when CRC/size values
// are unknown. Pre-compute the exact raw-DEFLATE size and CRC so every local header is complete.
// This only removes ZIP container overhead; entry payload semantics remain unchanged.
def compressedSizeFor = { byte[] payload ->
    Deflater deflater = new Deflater(9, true)
    try {
        deflater.setInput(payload)
        deflater.finish()
        byte[] buffer = new byte[8192]
        long compressedSize = 0L
        while (!deflater.finished()) {
            compressedSize += deflater.deflate(buffer)
        }
        return compressedSize
    } finally {
        deflater.end()
    }
}

// JAR/ZIP directory entries are optional metadata. Re-emit only real files with maximum DEFLATE
// compression after Loom has produced the runtime archive. Already-compressed payloads are STORED
// when DEFLATE would be larger. There is no class shrinking, renaming or semantic transformation here.
def recompressRuntimeArchive = { File archive ->
    if (!archive.isFile()) {
        throw new GradleException("Runtime archive does not exist: ${archive}")
    }

    List<Map<String, Object>> entries = []
    new ZipFile(archive).withCloseable { input ->
        input.entries().each { sourceEntry ->
            if (!sourceEntry.directory) {
                byte[] payload
                input.getInputStream(sourceEntry).withCloseable { stream ->
                    payload = stream.readAllBytes()
                }

                CRC32 crc32 = new CRC32()
                crc32.update(payload)
                long deflatedSize = compressedSizeFor(payload)
                boolean storeUncompressed = deflatedSize >= payload.length
                entries.add([
                        name          : sourceEntry.name,
                        payload       : payload,
                        method        : storeUncompressed ? ZipEntry.STORED : ZipEntry.DEFLATED,
                        compressedSize: storeUncompressed ? (long) payload.length : deflatedSize,
                        crc           : crc32.value,
                ])
            }
        }
    }

    File temporary = new File(archive.parentFile, archive.name + '.recompress.tmp')
    if (temporary.exists() && !temporary.delete()) {
        throw new GradleException("Unable to clear temporary archive: ${temporary}")
    }

    try {
        temporary.withOutputStream { fileOutput ->
            new ZipOutputStream(new BufferedOutputStream(fileOutput)).withCloseable { output ->
                output.setLevel(9)
                entries.each { record ->
                    byte[] payload = (byte[]) record.payload
                    ZipEntry targetEntry = new ZipEntry((String) record.name)
                    // 1980-01-01 is the DOS ZIP epoch boundary and makes the JDK add an extended
                    // timestamp field. 1980-01-02 remains timezone-independent with setTimeLocal,
                    // while fitting directly in the DOS timestamp and therefore needs no extra field.
                    targetEntry.setTimeLocal(LocalDateTime.of(1980, 1, 2, 0, 0))
                    targetEntry.setMethod((int) record.method)
                    targetEntry.setSize(payload.length)
                    targetEntry.setCompressedSize((long) record.compressedSize)
                    targetEntry.setCrc((long) record.crc)
                    output.putNextEntry(targetEntry)
                    output.write(payload)
                    output.closeEntry()
                }
            }
        }
        Files.move(
                temporary.toPath(),
                archive.toPath(),
                StandardCopyOption.REPLACE_EXISTING)
    } finally {
        if (temporary.exists()) temporary.delete()
    }
}

// Run compaction as an explicit final distribution step rather than relying on a `jar.doLast` hook.
// Loom/Gradle may finalize or restore archive task outputs after task actions; finalizing `assemble`
// guarantees the file inspected by external Artifact Audit is the compacted runtime JAR.
def compactRuntimeJar = tasks.register('compactRuntimeJar') {
    group = 'build'
    description = 'Compacts the final runtime JAR container without changing entry payload semantics.'
    dependsOn 'jar'

    doLast {
        def runtimeJarTask = tasks.named('jar').get()
        File runtimeJar = runtimeJarTask.archiveFile.get().asFile
        recompressRuntimeArchive(runtimeJar)
        logger.lifecycle('Compacted runtime JAR container: {} bytes', runtimeJar.length())
    }
}

tasks.matching { task -> task.name == 'assemble' }.configureEach {
    finalizedBy compactRuntimeJar
}

tasks.matching { task -> task.name == 'verifyRuntimeJarBudget' }.configureEach {
    dependsOn compactRuntimeJar
}
