def drawSparkle = { image, frame, top, bright, accent ->
    def anchors = [[1, 1], [14, 1], [14, 14], [1, 14]]
    def anchor = anchors[(frame.intdiv(2)) % anchors.size()]
    int x = anchor[0]
    int y = top + anchor[1]
    putPixel(image, x, y, accent)
    putPixel(image, x - 1, y, bright)
    putPixel(image, x + 1, y, bright)
    putPixel(image, x, y - 1, bright)
    putPixel(image, x, y + 1, bright)
    if ((frame & 1) == 1) {
        putPixel(image, x - 1, y - 1, accent)
        putPixel(image, x + 1, y + 1, accent)
    }
}

def writeBorderTexture = { output, spec ->
    def image = new BufferedImage(16, 128, BufferedImage.TYPE_INT_ARGB)
    def brightnessMix = [0.00d, 0.06d, 0.14d, 0.24d, 0.44d, 0.24d, 0.14d, 0.06d]
    def rgb = spec.color
    def accentRgb = spec.accent

    (0..<8).each { frame ->
        int top = frame * 16
        int base = whiteMix(rgb, brightnessMix[frame], 255)
        int bright = whiteMix(rgb, frame == 4 ? 0.82d : 0.52d, 255)
        int accent = whiteMix(accentRgb, frame == 4 ? 0.88d : 0.48d, 255)
        (0..<16).each { y -> (0..<16).each { x -> image.setRGB(x, top + y, base) } }

        int sweep = Math.floorMod(frame * 2, 16)
        switch (spec.motif) {
            case 'crystal':
                line(image, sweep, top, Math.max(0, sweep - 5), top + 15, bright)
                line(image, Math.min(15, sweep + 3), top, Math.max(0, sweep - 2), top + 15, accent)
                break
            case 'dotted':
                (1..<16).step(3) { y ->
                    putPixel(image, sweep, top + y, bright)
                    putPixel(image, Math.floorMod(sweep + 8, 16), top + y, accent)
                }
                break
            case 'runes':
                (1..<15).step(4) { y -> line(image, Math.max(0, sweep - 1), top + y, Math.min(15, sweep + 1), top + y, bright) }
                break
            case 'brackets':
                line(image, sweep, top + 2, sweep, top + 6, bright)
                line(image, sweep, top + 9, sweep, top + 13, accent)
                break
            case 'double':
                int second = Math.floorMod(sweep + 5, 16)
                line(image, sweep, top, sweep, top + 15, bright)
                line(image, second, top, second, top + 15, accent)
                break
            case 'wave':
                (0..<16).each { y ->
                    int x = Math.floorMod(sweep + (((y.intdiv(2)) % 3) - 1), 16)
                    putPixel(image, x, top + y, y % 4 == 0 ? accent : bright)
                }
                break
            case 'nodes':
                [2, 7, 12].each { y ->
                    putPixel(image, sweep, top + y, bright)
                    putPixel(image, Math.floorMod(sweep + 1, 16), top + y, accent)
                }
                break
            case 'sparks':
                (0..<7).each { i ->
                    int x = Math.floorMod(sweep + i * 5, 16)
                    int y = Math.floorMod(frame * 3 + i * 7, 16)
                    putPixel(image, x, top + y, (i & 1) == 0 ? bright : accent)
                }
                break
            case 'ancient':
                line(image, sweep, top + 1, Math.floorMod(sweep + 4, 16), top + 5, bright)
                line(image, Math.floorMod(sweep + 4, 16), top + 10, sweep, top + 14, accent)
                break
            case 'jagged':
                (0..<16).step(2) { y ->
                    int x = Math.floorMod(sweep + ((y.intdiv(2)) % 2 == 0 ? 0 : 2), 16)
                    putPixel(image, x, top + y, bright)
                    putPixel(image, Math.floorMod(x + 1, 16), top + y, accent)
                }
                break
        }
        drawSparkle(image, frame, top, bright, accent)
    }

    output.parentFile.mkdirs()
    if (!ImageIO.write(image, 'png', output)) throw new GradleException("No PNG writer is available for ${output}")
}

def writeAnimationMeta = { output ->
    output.parentFile.mkdirs()
    output.setText(JsonOutput.prettyPrint(JsonOutput.toJson([animation: [frametime: 1, interpolate: true]])) + '\n', 'UTF-8')
}

def allFaces = { texture ->
    def faces = [:]
    ['down', 'up', 'north', 'south', 'west', 'east'].each { side ->
        faces[side] = [texture: texture, cullface: side, uv: [0, 0, 16, 16]]
    }
    faces
}

def outwardEdgeFaces = { axis, firstHigh, secondHigh, texture ->
    def faces = [:]
    switch (axis) {
        case 'x':
            faces[firstHigh ? 'up' : 'down'] = [texture: texture, uv: [0, 0, 16, 16]]
            faces[secondHigh ? 'south' : 'north'] = [texture: texture, uv: [0, 0, 16, 16]]
            break
        case 'y':
            faces[firstHigh ? 'east' : 'west'] = [texture: texture, uv: [0, 0, 16, 16]]
            faces[secondHigh ? 'south' : 'north'] = [texture: texture, uv: [0, 0, 16, 16]]
            break
        case 'z':
            faces[firstHigh ? 'east' : 'west'] = [texture: texture, uv: [0, 0, 16, 16]]
            faces[secondHigh ? 'up' : 'down'] = [texture: texture, uv: [0, 0, 16, 16]]
            break
        default:
            throw new GradleException("Unknown ore-highlight edge axis: ${axis}")
    }
    faces
}

def addBorderRods = { elements, thicknessRaw, texture ->
    double thickness = thicknessRaw as double
    double edgeOffset = 0.06d
    double low = -edgeOffset
    double high = 16.0d + edgeOffset
    double highStart = 16.0d - thickness + edgeOffset

    [false, true].each { firstHigh ->
        [false, true].each { secondHigh ->
            double first = firstHigh ? highStart : low
            double second = secondHigh ? highStart : low
            elements << [
                    'from': [low, first, second],
                    'to': [high, first + thickness, second + thickness],
                    shade: false,
                    faces: outwardEdgeFaces('x', firstHigh, secondHigh, texture)]
            elements << [
                    'from': [first, low, second],
                    'to': [first + thickness, high, second + thickness],
                    shade: false,
                    faces: outwardEdgeFaces('y', firstHigh, secondHigh, texture)]
            elements << [
                    'from': [first, second, low],
                    'to': [first + thickness, second + thickness, high],
                    shade: false,
                    faces: outwardEdgeFaces('z', firstHigh, secondHigh, texture)]
        }
    }
}

def cubeModel = { baseTexture, highlightTexture, thickness ->
    def elements = [['from': [0, 0, 0], 'to': [16, 16, 16], faces: allFaces('#base')]]
    addBorderRods(elements, thickness, '#highlight')
    [ambientocclusion: true, textures: [base: baseTexture, highlight: highlightTexture, particle: baseTexture], elements: elements]
}

def ancientDebrisModel = { highlightTexture, thickness ->
    def baseFaces = [
            down: [texture: '#top', cullface: 'down', uv: [0, 0, 16, 16]],
            up: [texture: '#top', cullface: 'up', uv: [0, 0, 16, 16]],
            north: [texture: '#side', cullface: 'north', uv: [0, 0, 16, 16]],
            south: [texture: '#side', cullface: 'south', uv: [0, 0, 16, 16]],
            west: [texture: '#side', cullface: 'west', uv: [0, 0, 16, 16]],
            east: [texture: '#side', cullface: 'east', uv: [0, 0, 16, 16]]
    ]
    def elements = [['from': [0, 0, 0], 'to': [16, 16, 16], faces: baseFaces]]
    addBorderRods(elements, thickness, '#highlight')
    [
            ambientocclusion: true,
            textures: [
                    top: 'minecraft:block/ancient_debris_top',
                    side: 'minecraft:block/ancient_debris_side',
                    highlight: highlightTexture,
                    particle: 'minecraft:block/ancient_debris_side'
            ],
            elements: elements
    ]
}

def writeModel = { output, model ->
    output.parentFile.mkdirs()
    output.setText(JsonOutput.prettyPrint(JsonOutput.toJson(model)) + '\n', 'UTF-8')
}

