import java.awt.image.BufferedImage
import javax.imageio.ImageIO

def generatedVisualAssetsDir = layout.buildDirectory.dir('generated/chiseVisualAssets')

def argb = { int r, int g, int b ->
    ((0xFF << 24) | (r << 16) | (g << 8) | b) as int
}

def line = { BufferedImage image, int x0, int y0, int x1, int y1, int color ->
    int dx = Math.abs(x1 - x0)
    int sx = x0 < x1 ? 1 : -1
    int dy = -Math.abs(y1 - y0)
    int sy = y0 < y1 ? 1 : -1
    int error = dx + dy
    while (true) {
        if (x0 >= 0 && x0 < image.width && y0 >= 0 && y0 < image.height) {
            image.setRGB(x0, y0, color)
        }
        if (x0 == x1 && y0 == y1) break
        int twice = 2 * error
        if (twice >= dy) {
            error += dy
            x0 += sx
        }
        if (twice <= dx) {
            error += dx
            y0 += sy
        }
    }
}

def writeDiamondTexture = { File output, boolean deepslate ->
    BufferedImage image = new BufferedImage(16, 128, BufferedImage.TYPE_INT_ARGB)
    int base = deepslate ? argb(48, 48, 52) : argb(116, 116, 116)
    int baseAccent = deepslate ? argb(63, 61, 70) : argb(137, 135, 143)
    int[] violet = [
            argb(80, 65, 145),
            argb(112, 89, 190),
            argb(143, 119, 226),
            argb(184, 165, 255),
            argb(211, 197, 255)
    ] as int[]
    int[][] nodes = [
            [3, 3], [12, 3], [7, 6],
            [2, 10], [12, 11], [7, 14]
    ] as int[][]
    int[][] links = [
            [3, 3, 7, 6],
            [7, 6, 12, 3],
            [2, 10, 7, 14],
            [7, 14, 12, 11]
    ] as int[][]

    for (int frame = 0; frame < 8; frame++) {
        int top = frame * 16
        for (int y = 0; y < 16; y++) {
            for (int x = 0; x < 16; x++) {
                boolean grain = ((x * 5 + y * 3 + frame) % 13) == 0
                image.setRGB(x, top + y, grain ? baseAccent : base)
            }
        }

        for (int i = 0; i < links.length; i++) {
            int[] link = links[i]
            line(
                    image,
                    link[0],
                    top + link[1],
                    link[2],
                    top + link[3],
                    violet[(frame + i + 1) % violet.length])
        }

        for (int i = 0; i < nodes.length; i++) {
            int[] node = nodes[i]
            int x = node[0]
            int y = top + node[1]
            int color = violet[(frame + i) % violet.length]
            for (int oy = -1; oy <= 1; oy++) {
                for (int ox = -1; ox <= 1; ox++) {
                    if (Math.abs(ox) + Math.abs(oy) <= 1) {
                        image.setRGB(x + ox, y + oy, color)
                    }
                }
            }
            if (((frame + i) & 1) == 0 && x + 2 < 16) {
                image.setRGB(x + 2, y, color)
            }
        }
    }

    output.parentFile.mkdirs()
    if (!ImageIO.write(image, 'png', output)) {
        throw new GradleException("No PNG writer is available for ${output}")
    }
}

def generateChiseVisualAssets = tasks.register('generateChiseVisualAssets') {
    outputs.dir(generatedVisualAssetsDir)
    doLast {
        File textureDir = generatedVisualAssetsDir.get()
                .dir('assets/chisetweaks/textures/block/visual')
                .asFile
        writeDiamondTexture(new File(textureDir, 'diamond_ore_chise.png'), false)
        writeDiamondTexture(new File(textureDir, 'deepslate_diamond_ore_chise.png'), true)
    }
}

tasks.matching { it.name == 'processResources' }.configureEach {
    dependsOn(generateChiseVisualAssets)
    from(generatedVisualAssetsDir)
}

tasks.matching { it.name == 'test' }.configureEach {
    dependsOn(generateChiseVisualAssets)
}
