def argb = { a, r, g, b ->
    (((a as int) << 24) | ((r as int) << 16) | ((g as int) << 8) | (b as int)) as int
}

def clampChannel = { value -> Math.max(0, Math.min(255, Math.round(value as double) as int)) }

def whiteMix = { rgb, mix, alpha ->
    double amount = mix as double
    argb(
            alpha,
            clampChannel(rgb[0] + (255 - rgb[0]) * amount),
            clampChannel(rgb[1] + (255 - rgb[1]) * amount),
            clampChannel(rgb[2] + (255 - rgb[2]) * amount))
}

def putPixel = { image, x, y, color ->
    int px = x as int
    int py = y as int
    if (px >= 0 && px < image.width && py >= 0 && py < image.height) image.setRGB(px, py, color as int)
}

def line = { image, x0Raw, y0Raw, x1Raw, y1Raw, colorRaw ->
    int x0 = x0Raw as int
    int y0 = y0Raw as int
    int x1 = x1Raw as int
    int y1 = y1Raw as int
    int color = colorRaw as int
    int dx = Math.abs(x1 - x0)
    int sx = x0 < x1 ? 1 : -1
    int dy = -Math.abs(y1 - y0)
    int sy = y0 < y1 ? 1 : -1
    int error = dx + dy
    while (true) {
        putPixel(image, x0, y0, color)
        if (x0 == x1 && y0 == y1) break
        int twice = 2 * error
        if (twice >= dy) { error += dy; x0 += sx }
        if (twice <= dx) { error += dx; y0 += sy }
    }
}

