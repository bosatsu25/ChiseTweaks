def generateChiseVisualAssets = tasks.register('generateChiseVisualAssets') {
    outputs.dir(generatedVisualAssetsDir)
    doLast {
        File root = generatedVisualAssetsDir.get().asFile
        project.delete(root)
        File textureDir = new File(root, 'assets/chisetweaks/textures/block/visual/material')
        File modelDir = new File(root, 'assets/chisetweaks/models/block/visual/material')
        def specsByKey = materialSpecs.collectEntries { [(it.key): it] }

        materialSpecs.each { spec ->
            writeBorderTexture(new File(textureDir, "${spec.key}_highlight.png"), spec)
            writeAnimationMeta(new File(textureDir, "${spec.key}_highlight.png.mcmeta"))
        }

        modelSpecs.each { modelSpec ->
            def materialSpec = specsByKey[modelSpec.highlight]
            String texture = "chisetweaks:block/visual/material/${modelSpec.highlight}_highlight"
            writeModel(new File(modelDir, "${modelSpec.id}.json"), cubeModel(modelSpec.base, texture, materialSpec.thickness))
        }

        def ancientSpec = specsByKey['ancient_debris']
        writeModel(
                new File(modelDir, 'ancient_debris.json'),
                ancientDebrisModel('chisetweaks:block/visual/material/ancient_debris_highlight', ancientSpec.thickness))
    }
}

tasks.matching { it.name == 'processResources' }.configureEach {
    dependsOn(generateChiseVisualAssets)
    from(generatedVisualAssetsDir)
}

tasks.matching { it.name == 'test' }.configureEach {
    dependsOn(generateChiseVisualAssets)
}
