import groovy.json.JsonOutput
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

def generatedVisualAssetsDir = layout.buildDirectory.dir('generated/chiseVisualAssets')
def OVERLAY_OFFSET = 0.03d

def argb = { a, r, g, b ->
    (((a as int) << 24) | ((r as int) << 16) | ((g as int) << 8) | (b as int)) as int
}
def clampChannel = { value -> Math.max(0, Math.min(255, Math.round(value as double) as int)) }
def whiteMix = { rgb, mix, alpha ->
    double amount = mix as double
    argb(alpha,
            clampChannel(rgb[0] + (255 - rgb[0]) * amount),
            clampChannel(rgb[1] + (255 - rgb[1]) * amount),
            clampChannel(rgb[2] + (255 - rgb[2]) * amount))
}
def solidColor = { rgb, alpha -> argb(alpha, rgb[0], rgb[1], rgb[2]) }
def putPixel = { image, x, y, color ->
    int px = x as int
    int py = y as int
    if (px >= 0 && px < image.width && py >= 0 && py < image.height) image.setRGB(px, py, color as int)
}
def line = { image, x0Raw, y0Raw, x1Raw, y1Raw, colorRaw ->
    int x0 = x0Raw as int
    int y0 = y0Raw as int
    int x1 = x1Raw as int
    int y1 = y1Raw as int
    int color = colorRaw as int
    int dx = Math.abs(x1 - x0)
    int sx = x0 < x1 ? 1 : -1
    int dy = -Math.abs(y1 - y0)
    int sy = y0 < y1 ? 1 : -1
    int error = dx + dy
    while (true) {
        putPixel(image, x0, y0, color)
        if (x0 == x1 && y0 == y1) break
        int twice = 2 * error
        if (twice >= dy) { error += dy; x0 += sx }
        if (twice <= dx) { error += dx; y0 += sy }
    }
}

// One clean-room semantic definition per material family. Normal/deepslate variants deliberately
// share one overlay identity. These motifs are Chise-authored and contain no sampled pack pixels.
def materialSpecs = [
        [key: 'diamond', frame: [34, 225, 255], ore: [38, 190, 225], accent: [220, 254, 255], motif: 'crystal'],
        [key: 'gold', frame: [255, 190, 18], ore: [232, 160, 8], accent: [255, 248, 180], motif: 'dotted'],
        [key: 'emerald', frame: [20, 238, 92], ore: [10, 188, 68], accent: [202, 255, 219], motif: 'runes'],
        [key: 'coal', frame: [64, 72, 82], ore: [8, 10, 14], accent: [232, 240, 248], motif: 'brackets'],
        [key: 'iron', frame: [255, 190, 145], ore: [202, 145, 105], accent: [255, 241, 220], motif: 'double'],
        [key: 'copper', frame: [255, 105, 38], ore: [215, 76, 25], accent: [55, 210, 185], motif: 'wave'],
        [key: 'lapis', frame: [55, 112, 255], ore: [34, 68, 205], accent: [198, 218, 255], motif: 'nodes'],
        [key: 'redstone', frame: [255, 42, 42], ore: [220, 18, 18], accent: [255, 205, 205], motif: 'sparks'],
        [key: 'ancient_debris', frame: [137, 88, 66], ore: [82, 48, 40], accent: [198, 154, 114], motif: 'whorl'],
        [key: 'obsidian', frame: [174, 70, 255], ore: [101, 38, 164], accent: [235, 208, 255], motif: 'jagged'],
        [key: 'crying_obsidian', frame: [196, 45, 255], ore: [92, 22, 165], accent: [95, 180, 255], motif: 'tears'],
        [key: 'nether_gold', frame: [255, 210, 32], ore: [235, 160, 12], accent: [255, 247, 170], motif: 'nether_gold'],
        [key: 'nether_quartz', frame: [246, 238, 226], ore: [218, 203, 188], accent: [255, 255, 255], motif: 'quartz']
]

def drawOuterFrame = { image, top, frameColor, brightColor, frame ->
    line(image, 0, top, 15, top, frameColor)
    line(image, 0, top + 15, 15, top + 15, frameColor)
    line(image, 0, top, 0, top + 15, frameColor)
    line(image, 15, top, 15, top + 15, frameColor)
    int sweep = Math.floorMod(frame * 3, 12) + 2
    putPixel(image, sweep, top, brightColor)
    putPixel(image, 15, top + sweep, brightColor)
    putPixel(image, 15 - sweep, top + 15, brightColor)
    putPixel(image, 0, top + 15 - sweep, brightColor)
}

def drawSparkle = { image, frame, top, bright, accent ->
    def anchors = [[1, 1], [14, 1], [14, 14], [1, 14]]
    def anchor = anchors[(frame.intdiv(2)) % anchors.size()]
    int x = anchor[0]
    int y = top + anchor[1]
    putPixel(image, x, y, accent)
    putPixel(image, x - 1, y, bright)
    putPixel(image, x + 1, y, bright)
    putPixel(image, x, y - 1, bright)
    putPixel(image, x, y + 1, bright)
    if ((frame & 1) == 1) {
        putPixel(image, x - 1, y - 1, accent)
        putPixel(image, x + 1, y + 1, accent)
    }
}

def drawOreAccents = { image, spec, frame, top, oreColor, bright, accent ->
    int sweep = Math.floorMod(frame * 2, 10) + 3
    switch (spec.motif) {
        case 'crystal':
            [[4, 4], [11, 5], [7, 11]].each { p ->
                putPixel(image, p[0], top + p[1], oreColor)
                putPixel(image, p[0] - 1, top + p[1], bright)
                putPixel(image, p[0] + 1, top + p[1], bright)
                putPixel(image, p[0], top + p[1] - 1, bright)
                putPixel(image, p[0], top + p[1] + 1, bright)
            }
            break
        case 'dotted':
            [[3, 4], [8, 3], [12, 7], [5, 10], [10, 12]].each { p ->
                putPixel(image, p[0], top + p[1], oreColor)
            }
            putPixel(image, sweep, top + 8, bright)
            break
        case 'runes':
            [[3, 4], [10, 4], [5, 10], [12, 11]].each { p ->
                line(image, p[0], top + p[1], p[0] + 2, top + p[1], oreColor)
                putPixel(image, p[0], top + p[1] + 1, accent)
            }
            break
        case 'brackets':
            [[3, 4], [10, 4], [4, 10], [11, 11]].each { p ->
                putPixel(image, p[0], top + p[1], oreColor)
                putPixel(image, p[0] + 1, top + p[1], oreColor)
                putPixel(image, p[0], top + p[1] + 1, bright)
            }
            break
        case 'double':
            line(image, 4, top + 5, 7, top + 5, oreColor)
            line(image, 9, top + 10, 12, top + 10, oreColor)
            putPixel(image, sweep, top + 7, accent)
            break
        case 'wave':
            (3..12).each { x ->
                int y = 7 + ((x + frame) % 3) - 1
                putPixel(image, x, top + y, x % 4 == 0 ? accent : oreColor)
            }
            break
        case 'nodes':
            [[4, 4], [11, 4], [7, 8], [4, 12], [11, 11]].each { p ->
                putPixel(image, p[0], top + p[1], oreColor)
                putPixel(image, p[0] + 1, top + p[1], bright)
            }
            break
        case 'sparks':
            (0..<7).each { i ->
                int x = 3 + Math.floorMod(frame + i * 3, 10)
                int y = 3 + Math.floorMod(frame * 2 + i * 5, 10)
                putPixel(image, x, top + y, (i & 1) == 0 ? oreColor : bright)
            }
            break
        case 'whorl':
            line(image, 3, top + 3, 12, top + 3, oreColor)
            line(image, 12, top + 3, 12, top + 12, oreColor)
            line(image, 12, top + 12, 3, top + 12, accent)
            line(image, 3, top + 12, 3, top + 5, accent)
            line(image, 3, top + 5, 10, top + 5, oreColor)
            line(image, 10, top + 5, 10, top + 10, bright)
            line(image, 10, top + 10, 5, top + 10, oreColor)
            line(image, 5, top + 10, 5, top + 7, accent)
            line(image, 5, top + 7, 8, top + 7, oreColor)
            line(image, 8, top + 7, 8, top + 8, bright)
            def whorlPulse = [[6, 3], [12, 7], [8, 12], [3, 8]][frame % 4]
            putPixel(image, whorlPulse[0], top + whorlPulse[1], bright)
            putPixel(image, 7, top + 8, accent)
            break
        case 'jagged':
            line(image, 4, top + 4, 7, top + 7, oreColor)
            line(image, 7, top + 7, 5, top + 10, accent)
            line(image, 9, top + 5, 12, top + 8, oreColor)
            line(image, 12, top + 8, 10, top + 12, bright)
            break
        case 'tears':
            [4, 8, 12].eachWithIndex { x, index ->
                int start = 3 + Math.floorMod(frame + index * 2, 4)
                line(image, x, top + start, x, top + Math.min(13, start + 4), oreColor)
                putPixel(image, x, top + Math.min(14, start + 5), accent)
            }
            break
        case 'nether_gold':
            [[3, 3], [8, 4], [12, 6], [5, 9], [10, 12], [3, 12]].each { p ->
                putPixel(image, p[0], top + p[1], oreColor)
                if (((p[0] + frame) & 1) == 0) putPixel(image, p[0] + 1, top + p[1], bright)
            }
            break
        case 'quartz':
            line(image, 4, top + 11, 7, top + 4, oreColor)
            line(image, 7, top + 4, 10, top + 10, bright)
            line(image, 9, top + 12, 12, top + 6, accent)
            putPixel(image, sweep, top + 8, bright)
            break
        default:
            throw new GradleException("Unknown Chise overlay motif: ${spec.motif}")
    }
}

def drawFrame = { image, spec, frame, top ->
    def brightnessMix = [0.00d, 0.05d, 0.12d, 0.20d, 0.40d, 0.20d, 0.12d, 0.05d]
    int frameColor = whiteMix(spec.frame, brightnessMix[frame], 255)
    int bright = whiteMix(spec.frame, frame == 4 ? 0.86d : 0.56d, 255)
    int accent = whiteMix(spec.accent, frame == 4 ? 0.90d : 0.50d, 255)
    int oreColor = solidColor(spec.ore, 235)
    drawOuterFrame(image, top, frameColor, bright, frame)
    drawOreAccents(image, spec, frame, top, oreColor, bright, accent)
    drawSparkle(image, frame, top, bright, accent)
}

def writeAnimatedHighlightTexture = { output, spec ->
    def image = new BufferedImage(16, 128, BufferedImage.TYPE_INT_ARGB)
    (0..<8).each { frame -> drawFrame(image, spec, frame, frame * 16) }
    output.parentFile.mkdirs()
    if (!ImageIO.write(image, 'png', output)) throw new GradleException("No PNG writer is available for ${output}")
}

def writeStaticHighlightTexture = { output, spec ->
    def image = new BufferedImage(16, 16, BufferedImage.TYPE_INT_ARGB)
    // Static mode is exactly frame zero: same semantic motif, no motion.
    drawFrame(image, spec, 0, 0)
    output.parentFile.mkdirs()
    if (!ImageIO.write(image, 'png', output)) throw new GradleException("No PNG writer is available for ${output}")
}

def writeAnimationMeta = { output ->
    output.parentFile.mkdirs()
    output.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
            animation: [frametime: 1, interpolate: true]
    ])) + '\n', 'UTF-8')
}

def cubeFaces = { texture ->
    def faces = [:]
    ['down', 'up', 'north', 'south', 'west', 'east'].each { side ->
        faces[side] = [texture: texture, cullface: side, uv: [0, 0, 16, 16]]
    }
    faces
}

def overlayElement = { texture ->
    [
            from: [-OVERLAY_OFFSET, -OVERLAY_OFFSET, -OVERLAY_OFFSET],
            to: [16.0d + OVERLAY_OFFSET, 16.0d + OVERLAY_OFFSET, 16.0d + OVERLAY_OFFSET],
            shade: false,
            faces: cubeFaces(texture)
    ]
}

def overlayOnlyModel = { highlightTexture ->
    [
            ambientocclusion: false,
            textures: [highlight: highlightTexture, particle: highlightTexture],
            elements: [overlayElement('#highlight')]
    ]
}

def writeModel = { output, model ->
    output.parentFile.mkdirs()
    output.setText(JsonOutput.prettyPrint(JsonOutput.toJson(model)) + '\n', 'UTF-8')
}

def generateChiseVisualAssets = tasks.register('generateChiseVisualAssets') {
    outputs.dir(generatedVisualAssetsDir)
    doLast {
        File root = generatedVisualAssetsDir.get().asFile
        if (root.exists()) root.deleteDir()
        File textureDir = new File(root, 'assets/chisetweaks/textures/block/visual/material')
        File modelDir = new File(root, 'assets/chisetweaks/models/block/visual/overlay')

        materialSpecs.each { spec ->
            File animated = new File(textureDir, "${spec.key}_highlight.png")
            File staticTexture = new File(textureDir, "${spec.key}_highlight_static.png")
            writeAnimatedHighlightTexture(animated, spec)
            writeAnimationMeta(new File(textureDir, "${spec.key}_highlight.png.mcmeta"))
            writeStaticHighlightTexture(staticTexture, spec)

            String animatedTexture = "chisetweaks:block/visual/material/${spec.key}_highlight"
            String staticTextureId = "chisetweaks:block/visual/material/${spec.key}_highlight_static"
            writeModel(
                    new File(modelDir, "${spec.key}_animated.json"),
                    overlayOnlyModel(animatedTexture))
            writeModel(
                    new File(modelDir, "${spec.key}_static.json"),
                    overlayOnlyModel(staticTextureId))
        }
    }
}

tasks.matching { it.name == 'processResources' }.configureEach {
    dependsOn(generateChiseVisualAssets)
    from(generatedVisualAssetsDir)
}

tasks.matching { it.name == 'test' }.configureEach {
    dependsOn(generateChiseVisualAssets)
}
