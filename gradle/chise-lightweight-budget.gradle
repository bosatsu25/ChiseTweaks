import java.util.zip.ZipFile

// ChiseTweaksの配布用実行JAR容量を検証する。
// 350KiBは最終目標。M0で凍結した検証済みreleaseを上限にし、軽量化中の容量回帰を拒否する。
def CHISE_RUNTIME_JAR_TARGET_BYTES = Long.parseLong(project.property('runtime_jar_target_bytes').toString())
def CHISE_RUNTIME_JAR_BASELINE_BYTES = Long.parseLong(project.property('runtime_jar_baseline_bytes').toString())
def CHISE_RUNTIME_JAR_MAX_GROWTH_BYTES = Long.parseLong(project.property('runtime_jar_max_growth_bytes').toString())
def CHISE_RUNTIME_JAR_MAX_BYTES = Long.parseLong(project.property('runtime_jar_max_bytes').toString())
def CHISE_RUNTIME_JAR_EFFECTIVE_MAX_BYTES = Math.min(
        CHISE_RUNTIME_JAR_MAX_BYTES,
        CHISE_RUNTIME_JAR_BASELINE_BYTES + CHISE_RUNTIME_JAR_MAX_GROWTH_BYTES)
def CHISE_RUNTIME_ICON_PIXELS = Integer.parseInt(project.property('runtime_icon_target_pixels').toString())
def CHISE_RUNTIME_ICON_PATH = 'assets/chisetweaks/icon.png'

tasks.register('verifyRuntimeJarBudget') {
    group = 'verification'
    description = '実行JARの350KiB目標、容量回帰、配布用アイコン解像度を検証します。'
    dependsOn 'jar'

    doLast {
        def runtimeJarTask = tasks.named('jar').get()
        File runtimeJar = runtimeJarTask.archiveFile.get().asFile
        long size = runtimeJar.length()
        long deltaFromBaseline = size - CHISE_RUNTIME_JAR_BASELINE_BYTES
        long remainingToGoal = Math.max(0L, size - CHISE_RUNTIME_JAR_TARGET_BYTES)
        String deltaLabel = deltaFromBaseline >= 0 ? "+${deltaFromBaseline}" : Long.toString(deltaFromBaseline)

        logger.lifecycle(
                'Chise lightweight budget: {} bytes (goal <= {}, baseline {}, delta {}, remaining-to-goal {}, hard ceiling <= {})',
                size,
                CHISE_RUNTIME_JAR_TARGET_BYTES,
                CHISE_RUNTIME_JAR_BASELINE_BYTES,
                deltaLabel,
                remainingToGoal,
                CHISE_RUNTIME_JAR_EFFECTIVE_MAX_BYTES)

        def archive = new ZipFile(runtimeJar)
        try {
            def iconEntry = archive.getEntry(CHISE_RUNTIME_ICON_PATH)
            if (iconEntry == null) {
                throw new GradleException("Runtime JAR is missing ${CHISE_RUNTIME_ICON_PATH}")
            }
            def iconImage
            archive.getInputStream(iconEntry).withCloseable { input ->
                iconImage = javax.imageio.ImageIO.read(input)
            }
            if (iconImage == null) {
                throw new GradleException('Runtime JAR icon is not a readable PNG')
            }
            if (iconImage.width != CHISE_RUNTIME_ICON_PIXELS || iconImage.height != CHISE_RUNTIME_ICON_PIXELS) {
                throw new GradleException(
                        "Runtime JAR icon must be ${CHISE_RUNTIME_ICON_PIXELS}x${CHISE_RUNTIME_ICON_PIXELS}, " +
                        "got ${iconImage.width}x${iconImage.height}")
            }

            if (size > CHISE_RUNTIME_JAR_TARGET_BYTES) {
                logger.lifecycle('350KiB goal not reached yet; largest compressed runtime JAR entries:')
                archive.entries().toList()
                        .findAll { entry -> !entry.directory }
                        .sort { left, right -> Long.compare(right.compressedSize, left.compressedSize) }
                        .take(12)
                        .each { entry ->
                            logger.lifecycle(
                                    '  {} bytes compressed / {} bytes raw  {}',
                                    entry.compressedSize,
                                    entry.size,
                                    entry.name)
                        }
            }
        } finally {
            archive.close()
        }

        if (size > CHISE_RUNTIME_JAR_EFFECTIVE_MAX_BYTES) {
            throw new GradleException(
                    "Runtime JAR is ${size} bytes; baseline is ${CHISE_RUNTIME_JAR_BASELINE_BYTES} bytes, " +
                    "allowed growth is ${CHISE_RUNTIME_JAR_MAX_GROWTH_BYTES} bytes, and hard ceiling is " +
                    "${CHISE_RUNTIME_JAR_EFFECTIVE_MAX_BYTES} bytes.")
        }

        logger.lifecycle(
                'Runtime distribution budget PASS: {} bytes (<= {} hard ceiling), icon={}x{}',
                size,
                CHISE_RUNTIME_JAR_EFFECTIVE_MAX_BYTES,
                CHISE_RUNTIME_ICON_PIXELS,
                CHISE_RUNTIME_ICON_PIXELS)
    }
}

tasks.matching { it.name == 'check' || it.name == 'qualityGate' }.configureEach {
    dependsOn tasks.named('verifyRuntimeJarBudget')
}
