# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.warning.mode=all

# Minecraft 26.1.2 / Fabric
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17.19
fabric_api_version=0.155.2+26.1.2

# プロジェクト識別情報
# +mcより前をSemVer本体とし、Minecraft互換バージョンはSemVerのビルドメタデータとして扱う。
mod_version=0.15.0+mc26.1.2
maven_group=dev.chise.chisetweaks
archives_base_name=chise-tweaks

# 任意のUI互換
modmenu_version=18.0.0

# 任意の描画互換
sodium_version=vf7UgZpC
sodium_compat_version=0.9.1

# 保持型描画スコープの品質検証
jacoco_version=0.8.15
quality_line_threshold=0.96
quality_coverage_threshold=96
quality_mutation_threshold=96
quality_test_strength_threshold=96

# 配布用実行JARの容量予算
# Builder Tweaks化後の正式targetは290KiB(296,960 bytes)、stretchは250KiB(256,000 bytes)。
# 機能等価性を壊す削減は採用せず、実測JARを削減バッチごとに追跡する。
# 446,814 bytesは過去の検証済みartifactから固定したno-growth hard-size baseline。
# 現行16機能のproduct/functionality baselineはquality/functional-parity-baseline.jsonで別管理する。
runtime_icon_target_pixels=128
runtime_jar_target_bytes=296960
runtime_jar_stretch_bytes=256000
runtime_jar_baseline_bytes=446814
runtime_jar_max_growth_bytes=0
runtime_jar_max_bytes=446814
